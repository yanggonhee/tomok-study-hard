/* 2026-07 한손 조작 중심 초간결 UI */
:root{
  --black:#111;--text:#222;--dark:#3f3f3f;--mid:#777;
  --line:#dedede;--line-dark:#bdbdbd;--soft:#f4f4f4;--soft-2:#fafafa;--white:#fff
}
html{background:#f2f2f2}
body{background:#f2f2f2;padding-bottom:calc(82px + env(safe-area-inset-bottom))}
.app{width:min(100%,760px);padding:4px 6px 0}
header{position:sticky;top:0;z-index:30;margin:0 -2px 5px;padding:4px 2px 5px;background:rgba(242,242,242,.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.title-row{gap:8px;min-height:36px}
h1{font-size:18px;line-height:1.1;margin:0 0 4px;letter-spacing:-.4px}
.ghost{min-width:48px;height:32px;padding:0 9px;border-radius:8px;font-size:12px;background:#fff}
.progress-track{height:3px;border-radius:0;background:#d6d6d6}
.progress-bar{background:#4b4b4b}
.manage-panel{margin-top:5px;padding:7px;border-radius:9px;box-shadow:none}
.stats{gap:4px;margin-bottom:5px}.pill{padding:3px 7px;font-size:11px}
.toolbar{gap:4px}.toolbar select,.toolbar input,.toolbar button{min-height:34px;height:34px;padding:4px 7px;border-radius:7px;font-size:12px}
.toolbar input{min-width:130px}
.card{padding:8px 8px 10px;border-radius:10px;border:1px solid var(--line);box-shadow:none}
.meta{align-items:center;margin-bottom:5px}
#number{font-size:24px;letter-spacing:-.5px}.tag{padding:3px 7px;font-size:10px}.stars{font-size:11px}
.question{padding:8px 3px 10px;border:0;border-bottom:1px solid var(--line);border-radius:0;background:#fff;font-size:15px;line-height:1.5}
.question img{margin:6px auto}
.answer-section{margin-top:7px}.section-title-row{margin-bottom:4px}
.section-title-row h2{font-size:13px}.autosave{font-size:10px}
.answer-item{margin-bottom:4px}.answer-label{font-size:12px;margin-bottom:2px}
textarea.answer-input{min-height:35px;height:35px;max-height:160px;padding:6px 8px;border-radius:7px;font-size:14px;line-height:1.35}
.result,.official{margin-top:6px;padding:8px;border-radius:8px;font-size:13px}
.official h2{font-size:14px}.official-group{padding:6px 0;line-height:1.5}.mnemonic{margin-top:7px;padding:8px;border-radius:7px}
.control-dock{
  position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:100;
  width:min(100%,760px);margin:0;padding:5px 7px calc(5px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.98);border-top:1px solid #cfcfcf;
  box-shadow:0 -2px 10px rgba(0,0,0,.06);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)
}
.status-row{gap:4px;margin:0 0 4px}.status-row button{height:30px;border-radius:7px;font-size:11px;padding:0 2px;font-weight:750}
.status-row button.active{border:1px solid #555;background:#dedede;font-weight:900}
.answer-actions{gap:4px}.answer-actions button{height:38px;border-radius:8px;font-size:13px;padding:0 2px}
.answer-actions #check,.answer-actions #next{font-weight:900;border-color:#777;background:#ececec}
.answer-actions #next{background:#dcdcdc}
button:active{transform:none;background:#d7d7d7}
.answer-input.auto-corrected{color:#444;background:#ededed;border-color:#777;font-weight:850;text-decoration:none}
@media(max-width:560px){
  body{padding-bottom:calc(80px + env(safe-area-inset-bottom))}
  .app{padding:3px 4px 0}.card{padding:7px 7px 9px}.question{font-size:14.5px;padding:7px 2px 8px}
  .control-dock{padding-left:5px;padding-right:5px}.status-row button{height:29px;font-size:10.5px}.answer-actions button{height:37px;font-size:12.5px}
  textarea.answer-input{font-size:14px}
}

    if(pieces.length===1&&/\s/.test(s)){pieces=s.split(/\s+/).filter(Boolean);spaceOnly=true}
    if(pieces.length<=1||pieces.length>70)return [s];
    const n=pieces.length,dp=Array(n+1).fill(null);dp[n]={value:0,parts:[],all:true};

      let best=null;

        const forms=[pieces.slice(i,j).join(', '),pieces.slice(i,j).join(' ')];
        let top={score:0,quality:0},chosen=forms[spaceOnly?1:0];
        for(const f of forms)for(const o of options){const r=match(f,o);if(r.score>top.score||r.score===top.score&&r.quality>top.quality){top=r;chosen=f}}

  // Maximum-weight one-to-one assignment: exact matches cannot be consumed by

  function assign(matrix,n){

  const specs=new Map();

  function requestedNumber(text){

  }
  const SECTION_QUOTAS={68:[2,2],133:[1,3],176:[1,1,2,1,1],198:[2,2,3,3,1],432:[3]};
  function compile(q){
    const source=q._studyOriginal||q;
    const override=OVERRIDES[q.id];
    let raw=override?.sections||[{kind:'list',title:'',items:source.allAnswers,old:source.inputLabels.map((_,i)=>i)}];
    let legacyOffset=0;

  }
  function prepare(bank){
    for(const q of bank){
      const spec=compile(q);specs.set(q.id,spec);
      Object.defineProperty(q,'_studyOriginal',{value:{inputLabels:q.inputLabels,answerGroups:q.answerGroups,allAnswers:q.allAnswers,question:q.question,mode:q.mode,required:q.required},enumerable:false});

      q.answerGroups=spec.sections.flatMap(s=>s.indexes.map((_,i)=>s.kind==='list'?s.options.flatMap(o=>o.aliases):s.kind==='sequence'?s.options[i].aliases:s.options[0].aliases));

  function schema(q){return specs.get(q.id)||compile(q)}
  function grade(q,values){
    const spec=schema(q),results=[];let correct=0,partial=0;const sectionPass=[];
    for(let si=0;si<spec.sections.length;si++){
      const s=spec.sections[si];
      if(s.kind==='fixed'){
        const entered=String(values[s.indexes[0]]||'').trim(),opt=s.options[0];
        let r=match(entered,opt);if(r.score!==1&&entered){const pieces=splitAnswer(entered,[opt]);if(pieces.length>1&&pieces.every(p=>match(p,opt).score===1))r={score:1,quality:1,reason:'등록된 대체 답안 — 한 항목으로 인정'}}results.push({...r,entered,label:s.title,expected:opt.text,section:si,field:s.indexes[0]});
        correct+=r.score===1;partial+=r.score>0&&r.score<1;sectionPass.push(r.score===1);continue;
      }
      let entries=[];
      if(s.kind==='sequence'){
        const fields=s.indexes.map(i=>String(values[i]||'').trim());
        const chunks=fields.map(t=>{
          if(!t)return [''];
          if(/^[\d\s,;→>\-–.]+$/.test(t))return t.split(/\s*(?:->|→|[\s,;\-–>])+\s*/).filter(Boolean).map(x=>x.replace(/\.$/,''));

        for(let i=0;i<Math.max(entries.length,s.options.length);i++){
          const opt=s.options[i],entered=entries[i]||'',r=opt?match(entered,opt):{score:0,quality:0,reason:'단계 수 초과'};
          results.push({...r,entered,label:`${s.title} ${i+1}`,expected:opt?.text||'등록 단계 없음',section:si});correct+=r.score===1;partial+=r.score>0&&r.score<1;
        }
        sectionPass.push(entries.length===s.required&&results.filter(r=>r.section===si).every(r=>r.score===1));
        continue;
      }
      for(const field of s.indexes){splitAnswer(values[field]||'',s.options).forEach((entered,part)=>entries.push({entered,field,part}))}
      if(entries.length>70)entries=entries.slice(0,70).concat({entered:'입력 항목이 너무 많습니다. 나누어 입력하세요.',field:s.indexes[0]});
      const seen=new Set();
      const matrix=entries.map(e=>{
        const k=fold(e.entered);if(seen.has(k)){e.duplicate=true;return s.options.map(()=>({score:0,quality:0,reason:'중복 답안 — 한 번만 인정'}))}seen.add(k);

        }

      const partly=local.filter(r=>r.score>0&&r.score<1).length;

  }
  function officialRows(q){const spec=schema(q);return [...spec.sections.flatMap(s=>s.options.map((o,i)=>({label:s.kind==='fixed'?s.title:s.title?`${s.title} ${i+1}.`:`${i+1}.`,text:o.text}))),...spec.referenceRows];}
  function migrateState(state){
    if(state.gradingVersion===VERSION)return;
    const fromExpanded=state.gradingVersion==='civil-445-20261008-v2';
    for(const bucket of ['answers','attempts']){
      if(!state[bucket]||typeof state[bucket]!=='object')continue;
      for(const [id,old] of Object.entries(state[bucket])){
        const spec=specs.get(Number(id));if(!spec||!Array.isArray(old))continue;

          }else{
            const parts=texts.flatMap(t=>splitAnswer(t,s.options));
            if(s.indexes.length===1&&s.required>1)next[s.indexes[0]]=parts.join(', ');

CivilGrader.prepare(BANK);

<script>
const $=s=>document.querySelector(s);
const STORAGE_KEY='essay445-v1';

// 문제 지문이나 번호가 아닌 기존 출제표시(label)로만 연도를 분류한다.
// 예: 14-1 → 2014년, 20-4, 5 → 2020년, 26-1-2 → 2026년.
function questionYear(q){
  const match=String(q?.label||'').trim().match(/^(\d{4}|\d{2})(?=\s*(?:년|[-–—]|$))/);
  if(!match)return 'unknown';
  return String(match[1].length===2?2000+Number(match[1]):Number(match[1]));
}
const YEAR_COUNTS=new Map();
BANK.forEach(q=>{const y=questionYear(q);YEAR_COUNTS.set(y,(YEAR_COUNTS.get(y)||0)+1)});
const AVAILABLE_YEARS=[...YEAR_COUNTS.keys()].filter(y=>y!=='unknown').sort((a,b)=>Number(b)-Number(a));
if(YEAR_COUNTS.has('unknown'))AVAILABLE_YEARS.push('unknown');
function validYearFilter(value){return value==='all'||YEAR_COUNTS.has(String(value))?String(value):'all'}
function activeYear(){return validYearFilter(state.yearFilter||'all')}
function matchesQuestionYear(q){return activeYear()==='all'||questionYear(q)===activeYear()}
function yearScopeIndices(){return BANK.reduce((out,q,i)=>{if(matchesQuestionYear(q))out.push(i);return out},[])}
function yearScopeCount(){return activeYear()==='all'?BANK.length:(YEAR_COUNTS.get(activeYear())||0)}
function yearName(year){return year==='all'?'전체 연도':year==='unknown'?'연도 미분류':`${year}년`}
function scopedWrongCount(){return BANK.reduce((n,q)=>n+(matchesQuestionYear(q)&&state.wrong[qkey(q)]?1:0),0)}
function closeYearPanel(){
  const panel=$('#yearPanel');if(panel)panel.hidden=true;
  $('#yearToggle')?.setAttribute('aria-expanded','false');
}
function updateYearUI(){
  const year=activeYear(),selected=year!=='all',toggle=$('#yearToggle');
  if(toggle){
    toggle.textContent=selected?`과년도 · ${yearName(year)} ▾`:'과년도 ▾';
    toggle.classList.toggle('active',selected);
    toggle.title=state.fast30Mode?'빠른 암기를 종료한 뒤 연도를 바꿀 수 있습니다.':`출제 연도 선택 · ${yearName(year)}`;
    toggle.setAttribute('aria-label',`과년도 선택, 현재 ${yearName(year)}`);
  }
  document.querySelectorAll('[data-year-filter]').forEach(btn=>btn.setAttribute('aria-pressed',String(btn.dataset.yearFilter===year)));
  const summary=$('#yearActiveSummary');
  if(summary)summary.hidden=!selected;
  if($('#yearActiveText'))$('#yearActiveText').textContent=`${yearName(year)} 문제만 보기 · ${yearScopeCount()}문항`;
  const allOption=$('#mode option[value="all"]');
  if(allOption)allOption.textContent=`전체 ${yearScopeCount()}문항`;
}
function selectYear(year){
  if(state.fast30Mode)return;
  const next=validYearFilter(year);
  if(next===activeYear()){closeYearPanel();$('#yearToggle')?.focus();return}
  // 연도 선택은 그 연도의 전체 문제부터 시작한다. 학습기록은 지우지 않는다.
  save();
  state.yearFilter=next;
  $('#mode').value='all';state.mode='all';
  $('#search').value='';state.search='';
  closeYearPanel();
  applyView({closePanel:false,resetPosition:next!=='all'});
  $('#yearToggle')?.focus();
}
function initYearPicker(){
  const options=$('#yearOptions');
  if(!options)return;
  ['all',...AVAILABLE_YEARS].forEach(year=>{
    const btn=document.createElement('button');btn.type='button';btn.dataset.yearFilter=year;
    const name=document.createElement('span');name.textContent=yearName(year);
    const count=document.createElement('span');count.className='year-count';count.textContent=`(${year==='all'?BANK.length:YEAR_COUNTS.get(year)})`;
    btn.setAttribute('aria-label',`${yearName(year)}, ${year==='all'?BANK.length:YEAR_COUNTS.get(year)}문항`);
    btn.append(name,count);btn.onclick=()=>selectYear(year);options.append(btn);
  });
  $('#yearToggle').onclick=()=>{
    if(state.fast30Mode)return;
    const panel=$('#yearPanel'),open=panel.hidden;
    panel.hidden=!open;$('#yearToggle').setAttribute('aria-expanded',String(open));updateYearUI();
  };
  $('#yearPanelClose').onclick=()=>{closeYearPanel();$('#yearToggle').focus()};
  $('#yearClear').onclick=()=>selectYear('all');
  // 기존 Enter 채점 단축키와 새 연도 선택 버튼의 키보드 조작이 겹치지 않게 한다.
  [$('#yearToggle'),$('#yearPanel'),$('#yearClear')].forEach(el=>el.addEventListener('keydown',e=>{
    if(e.key==='Enter'||e.key===' ')e.stopPropagation();
    if(e.key==='Escape'){e.preventDefault();e.stopPropagation();closeYearPanel();$('#yearToggle').focus()}
  }));
  document.addEventListener('click',e=>{
    if(!$('#yearPanel').hidden&&!$('#yearPanel').contains(e.target)&&!$('#yearToggle').contains(e.target))closeYearPanel();
  });
  $('#manageToggle').addEventListener('click',()=>{if(!$('#managePanel').classList.contains('open'))closeYearPanel()});
  updateYearUI();
}

function createInitialState(){
  return {answers:{},fav:{},wrong:{},status:{},corrections:{},attempts:{},review:{},wrongMeta:{},flashStats:{},memoryVerify:{},flashMode:false,headerCollapsed:true,index:0,currentId:1,allReturnId:1,view:[],mode:'all',search:'',yearFilter:'all'};
}
let state;
try{state=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null')}catch(e){state=null}
if(!state||typeof state!=='object')state=createInitialState();
state.answers||={};state.fav||={};state.wrong||={};state.status||={};state.corrections||={};state.attempts||={};state.review||={};state.wrongMeta||={};state.flashStats||={};state.memoryVerify||={};if(typeof state.headerCollapsed!=='boolean')state.headerCollapsed=true;Object.keys(state.status).forEach(k=>{if(state.status[k]==='uncertain')state.status[k]='unmastered'});if(state.mode==='uncertain'||state.mode==='unmastered')state.mode='needsStudy';if(state.allReturnId==null)state.allReturnId=(state.mode==='all'&&state.currentId!=null)?state.currentId:1;

if(state.gradingVersion!==CivilGrader.VERSION){
  try{const original=localStorage.getItem(STORAGE_KEY);const backupKey='essay445-grading-backup-20261008-v3';if(original&&!localStorage.getItem(backupKey))localStorage.setItem(backupKey,original)}catch(e){}
  CivilGrader.migrateState(state);
}

const savedView=Array.isArray(state.view)&&state.view.length&&state.view.every(i=>Number.isInteger(i)&&i>=0&&i<BANK.length)?state.view:null;
let view=savedView?[...savedView]:[...BANK.keys()];
let pos=Math.min(Number.isInteger(state.index)?state.index:0,Math.max(0,view.length-1));
if(state.currentId!=null){
  const restoredPos=view.findIndex(i=>BANK[i]&&BANK[i].id===state.currentId);
  if(restoredPos>=0)pos=restoredPos;
}
const ALIASES={'rockbolt':['록볼트','락볼트'],'rock bolt':['록볼트','락볼트'],'shotcrete':['숏크리트','쇼트크리트'],'sandmat':['샌드매트','샌드매트공법','부사'],'sand mat':['샌드매트','샌드매트공법','부사'],'wellpoint':['웰포인트'],'well point':['웰포인트'],'deepwell':['딥웰'],'deep well':['딥웰'],'pulling':['풀링'],'pushing':['푸싱'],'rcd':['역순환공법','알씨디'],'muck':['버력','먹'],'heaving':['히빙'],'boiling':['보일링','퀵샌드'],'quick sand':['보일링','퀵샌드'],'forepoling':['훠폴링','포어폴링'],'fore poling':['훠폴링','포어폴링'],'pipe roof':['파이프루프'],'mass curve':['토적곡선','매스커브'],'seal coat':['실코트'],'overlay':['오버레이'],'over lay':['오버레이'],'spalling':['스폴링']};
const aliasEntries=Object.entries(ALIASES).sort((a,b)=>b[0].length-a[0].length);
let memoryTimer=null,memoryNextTimer=null,memoryActive=false,examActive=false,examOriginalView=null,examStartedAt=0;
function save(){
  state.index=pos;
  state.view=[...view];
  state.currentId=(view.length&&BANK[view[pos]])?BANK[view[pos]].id:null;
  const activeMode=$('#mode')?.value||state.mode||'all';
  if(activeMode==='all'&&activeYear()==='all'&&!state.fast30Mode&&state.currentId!=null)state.allReturnId=state.currentId;
  state.mode=activeMode;
  state.search=$('#search')?.value||'';
  localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
}
function norm(s){let x=(s||'').normalize('NFKC').toLowerCase();for(const [en,kos] of aliasEntries){const canon=kos[0];x=x.split(en).join(canon);for(const ko of kos)x=x.split(ko).join(canon)}return x.replace(/[^0-9a-z가-힣]/g,'')}
function similarity(a,b){if(a===b)return 1;const m=a.length,n=b.length;if(!m||!n)return 0;const d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return 1-d[m][n]/Math.max(m,n)}
const STOP_WORDS=new Set(['방법','공법','종류','가지','대한','의한','위한','하는','하여','있다','된다','것','및','또는','등','때문','경우','사용','설치','시공','적용','필요','가능','형성','확보','발생','예상','결정','검토','확인','증가','감소','저하','방지','유지','개량']);
function cleanToken(t){let x=(t||'').normalize('NFKC').toLowerCase().replace(/[^0-9a-z가-힣]/g,'');x=x.replace(/(으로써|으로서|에서의|에게서|까지의|부터의|으로|에서|에게|한테|처럼|보다|까지|부터|이고|이며|하고|이나|거나|의|을|를|이|가|은|는|에|로|와|과)$/,'');return norm(x)}
function keywords(s){const raw=(s||'').match(/[가-힣]+|[a-zA-Z]+|[0-9.]+/g)||[];let ks=raw.map(cleanToken).filter(x=>x.length>=2&&!STOP_WORDS.has(x));if(!ks.length){const n=norm(s);if(n.length>=2)ks=[n]}return [...new Set(ks)]}

function memoryClean(text){
  let s=String(text||'')
    .normalize('NFKC')
    .replace(/\([^)]*\)/g,' ')
    .replace(/[·•]/g,' ')
    .replace(/\s+/g,' ')
    .trim();

  MEMORY_REPLACEMENTS.forEach(([a,b])=>{s=s.replace(a,b)});
  MEMORY_DROP_WORDS.forEach(w=>{
    s=s.replace(new RegExp(`(^|\\s)${w}(?=\\s|$)`,'g'),' ')
  });

  s=s
    .replace(/^(다음과 같다|다음 사항|다음 내용)\s*/,'')
    .replace(/\s*(한다|한다\.|할 것|하여야 한다|해야 한다)$/,'')
    .replace(/\s+/g,' ')
    .trim();

  if(s.length>22){
    const ks=keywords(s).slice(0,3);
    if(ks.length)s=ks.join(' ');
  }
  return s||String(text||'').trim();
}

function memoryCore(text){
  const s=memoryClean(text);
  const actionMap=[
    ['방지','막기'],['감소','줄이기'],['저하','낮추기'],['증가','높이기'],
    ['확보','챙기기'],['측정','재기'],['확인','보기'],['검토','살피기'],
    ['제거','빼기'],['배수','물빼기'],['보강','단단히'],['보호','지키기'],
    ['고정','묶기'],['차단','막기'],['연결','잇기'],['환기','바람넣기'],
    ['경고','알리기'],['대피','피하기'],['정리','치우기']
  ];
  for(const [key,word] of actionMap){
    if(s.includes(key)){
      const subject=s.replace(key,'').replace(/\s+/g,' ').trim();
      return (subject?subject+' ':'')+word;
    }
  }
  return s;
}

function makeScene(cores){
  if(!cores.length)return '';
  if(cores.length===1)return `${cores[0]}를 한 장면으로 기억`;
  if(cores.length===2)return `${cores[0]}고, ${cores[1]}`;
  if(cores.length===3)return `${cores[0]}, ${cores[1]}, 마지막으로 ${cores[2]}`;
  const head=cores.slice(0,-1).join(' → ');
  return `${head} → 끝에 ${cores[cores.length-1]}`;
}

function mnemonicToken(text){
  const core=memoryCore(text||'').trim();
  if(!core)return '';

  /* 영문 약어·기호로 시작하면 영문 첫 글자를 우선한다.
     예: CBR → C, K값 → K, Cone값 → C, N치 → N */
  const leadingEnglish=core.match(/^\s*([A-Za-z])/);
  if(leadingEnglish)return leadingEnglish[1].toUpperCase();

  const leadingKorean=core.match(/^\s*([가-힣])/);
  if(leadingKorean)return leadingKorean[1];

  const anyEnglish=core.match(/[A-Za-z]/);
  if(anyEnglish)return anyEnglish[0].toUpperCase();
  const anyKorean=core.match(/[가-힣]/);
  return anyKorean?anyKorean[0]:core.slice(0,1);
}

function hasBatchim(word){
  const ch=(word||'').trim().slice(-1);
  if(!ch)return false;
  const code=ch.charCodeAt(0)-0xAC00;
  return code>=0&&code<=11171&&(code%28)!==0;
}
function particle(word,withBatchim,withoutBatchim){return hasBatchim(word)?withBatchim:withoutBatchim}
function subject(word){return word+particle(word,'이','가')}
function object(word){return word+particle(word,'을','를')}
function withWord(word){return word+particle(word,'과','와')}

function buildMnemonicSentence(items){
  const w=items.map(x=>x.word).filter(Boolean);
  const n=w.length;
  if(n===2)return `${subject(w[0])} ${object(w[1])} 챙긴다`;
  if(n===3)return `${subject(w[0])} ${object(w[1])} 들고 ${w[2]}로 간다`;
  if(n===4)return `${subject(w[0])} ${object(w[1])} 들고 ${withWord(w[2])} 함께 ${w[3]}로 간다`;
  if(n===5)return `${subject(w[0])} ${w[1]}, ${w[2]}, ${object(w[3])} 챙겨 ${w[4]}로 간다`;
  return `${w.slice(0,-1).join(', ')}를 차례로 챙겨 마지막에 ${w[n-1]}로 간다`;
}

function mnemonicAnswerSet(q){
  const groups=Array.isArray(q.allAnswers)?q.allAnswers:[];
  if(Array.isArray(q.mnemonicOrder)&&q.mnemonicOrder.length){
    return q.mnemonicOrder.map(n=>groups[Number(n)-1]).map(g=>Array.isArray(g)?g[0]:'').filter(Boolean);
  }
  if(q.mode==='grouped')return groups.map(g=>Array.isArray(g)?g[0]:'').filter(Boolean);
  const required=Math.max(1,Number(q.required)||((q.inputLabels||[]).length)||1);
  return groups.slice(0,required).map(g=>Array.isArray(g)?g[0]:'').filter(Boolean);
}

function easyMnemonicWord(token){
  if(EASY_MNEMONIC_WORDS[token])return EASY_MNEMONIC_WORDS[token];
  if(MNEMONIC_WORDS[token])return MNEMONIC_WORDS[token];
  if(/^[A-Z]$/.test(token))return MNEMONIC_WORDS[token]||`${token}로봇`;
  if(/^[가-힣]+$/.test(token))return `${token}돌이`;
  return `${token}카드`;
}

function easyMnemonicScene(words){
  if(!words.length)return '';
  if(words.length===1)return `${subject(words[0])} 크게 손을 흔들어요.`;
  const last=words[words.length-1];
  return `${words.join(', ')}${particle(last,'이','가')} 한 줄 기차를 타요.`;
}

function mnemonicFor(q){
  const answers=mnemonicAnswerSet(q);
  if(!answers.length)return null;

  const tokens=answers.map(initialOf).filter(Boolean);
  const words=tokens.map(easyMnemonicWord);
  const links=answers.map((answer,i)=>`${tokens[i]||'?'} = ${answer}`).join('<br>');

  return{
    code:`두문법 · ${tokens.join('·')}`,
    scene:easyMnemonicScene(words),
    note:`두문 풀기<br>${links}`
  };
}

// Manual navigation: preserve the active order, skip completed items, and wrap.
// The size of the unmastered list is never hard-coded.
function studyNavigationPlan(previousOrder,currentIndex,eligible,delta){
  const allowed=new Set(eligible);
  if(!allowed.size)return null;
  const ring=[...new Set([...previousOrder,...eligible])].filter(i=>BANK[i]);
  const direction=delta<0?-1:1;
  const at=ring.indexOf(currentIndex);
  const ordered=ring.filter(i=>allowed.has(i));
  if(at<0)return{view:ordered,index:direction>0?ordered[0]:ordered[ordered.length-1]};
  for(let step=1;step<=ring.length;step++){
    const candidate=ring[((at+direction*step)%ring.length+ring.length)%ring.length];
    if(allowed.has(candidate))return{view:ordered,index:candidate};
  }
  return null;
}

function moveWithinActiveView(delta){

  const oldQ=current();

    // Save the old position BEFORE filtering out a newly mastered question.
    // This also preserves the successor of a removed item in shuffled order.
    const previousOrder=[...view],currentIndex=view[pos];
    clearCurrentUnlessMastered();
    const eligible=filteredIndices('needsStudy',norm($('#search')?.value||''));
    const plan=studyNavigationPlan(previousOrder,currentIndex,eligible,delta);
    if(!plan){showNeedsStudyComplete();return;}
    view=plan.view;pos=view.indexOf(plan.index);

  }

  const oldId=oldQ.id;

  const target=sameCurrent?pos+delta:(delta>0?pos:pos-1);

  pos=target;render();

<script id="flashcard-mode-addon-script">
(()=>{
  state.flashMode=!!state.flashMode;
  state.flashStats||={};
  const flashToggle=document.createElement('button');
  flashToggle.id='flashToggle';flashToggle.className='study-tool';flashToggle.type='button';flashToggle.textContent='앱카드';
  document.querySelector('#manageToggle').insertAdjacentElement('beforebegin',flashToggle);

  const panel=document.createElement('section');panel.id='flashcardPanel';panel.className='flashcard-panel';
  panel.innerHTML=`<div id="flashCard" class="flash-card" role="button" tabindex="0" aria-label="카드를 눌러 문제와 정답 전환">
    <div id="flashQuestion" class="flash-question"></div>
    <div id="flashAnswer" class="flash-answer"><div id="flashAnswerText"></div><div id="flashTip" class="flash-tip"></div></div>
  </div>
  <div class="flash-nav" aria-label="앱카드 문제 이동"><button id="flashPrev" type="button">이전</button><button id="flashNext" type="button">다음</button></div>
  <div class="flash-ratings" aria-label="암기 상태"><button data-rate="unmastered">암기 못함</button><button data-rate="mastered">암기 완료</button></div>
  <div id="flashDue" class="flash-due"></div>`;
  document.querySelector('.inline-actions').insertAdjacentElement('afterend',panel);

  function answerText(q){return (q.allAnswers||[]).map((g,i)=>`${i+1}. ${(g||[]).join(' / ')}`).join('\n');}
  function flashTipData(q){
    return mnemonicFor(q);
  }
  function renderFlashTip(q){
    const tip=document.querySelector('#flashTip'),memo=flashTipData(q);
    if(!memo){tip.innerHTML='';tip.style.display='none';return}
    tip.style.display='';
    tip.innerHTML=`<div class="flash-tip-title">암기 팁</div><div class="flash-tip-code">${memo.code}</div>${memo.scene?`<div class="flash-tip-scene">“${memo.scene}”</div>`:''}<div class="flash-tip-note">${memo.note}</div>`;
  }
  function questionText(q){
    if(q.hideGroupedChoices||q.mode!=='grouped'||!Array.isArray(q.inputLabels)||!q.inputLabels.length)return q.question;
    const choices=q.inputLabels.map((label,i)=>`${i+1}. ${label}`).join('\n');
    return `${q.question}\n\n${choices}`;
  }
  function renderFlash(){
    document.body.classList.toggle('flashcard-mode',state.flashMode);
    flashToggle.classList.toggle('active',state.flashMode);
    flashToggle.textContent=state.flashMode?'문제풀이':'앱카드';
    if(!state.flashMode)return;
    const q=current(),k=qkey(q),card=document.querySelector('#flashCard');
    setFlashSide('question');
    document.querySelector('#flashQuestion').textContent=questionText(q);
    document.querySelector('#flashAnswerText').textContent=answerText(q);
    renderFlashTip(q);
    const due=state.review[k]?.due;
    document.querySelector('#flashDue').textContent=due?`다음 복습 예정: ${due}`:'아직 복습 일정 없음';
  }

  function setFlashSide(side){
    const card=document.querySelector('#flashCard');
    const showAnswer=side==='answer';
    card.classList.toggle('flipped',showAnswer);
  }
  function flip(){setFlashSide(document.querySelector('#flashCard').classList.contains('flipped')?'question':'answer')}
  function rate(kind){
    const autoOrigin=window.CivilFlashRepeat?.captureFlash();
    const k=qkey(current());
    if(kind==='mastered'){
      state.status[k]='mastered';
      scheduleReview(k,'mastered');
      // 앱카드의 자기평가는 화면상 완료로 표시하되, 실제 암기 검증은 타이핑으로 한 번 더 한다.
      state.memoryVerify[k]={pending:true,due:localDateKey(),source:'flashcard',reason:'typing',marked:localDateKey()};
    }else{
      state.status[k]='unmastered';
      scheduleReview(k,'unmastered');
      delete state.memoryVerify[k];
    }
    const fs=state.flashStats[k]||{count:0};
    fs.count++;
    fs.last=localDateKey();
    fs.rating=kind;
    state.flashStats[k]=fs;
    save();
    if(window.CivilFlashRepeat?.afterFlashRating(autoOrigin))return;
    const activeMode=$('#mode')?.value||state.mode||'all';
    if(['mastered','needsStudy'].includes(activeMode)){
      const oldBankIndex=view[pos];
      const fresh=filteredIndices(activeMode,norm($('#search')?.value||''));
      if(!fresh.length){
        view=[];
        $('#mode').value='all';
        state.mode='all';
        view=filteredIndices('all',norm($('#search')?.value||''));
        pos=Math.min(oldBankIndex??0,Math.max(0,view.length-1));
        save();render();
        alert('현재 상태의 앱카드 학습을 모두 마쳤습니다.');
        return;
      }
      view=fresh;
      let nextPos=view.findIndex(i=>i>oldBankIndex);
      if(nextPos<0)nextPos=0;
      pos=nextPos;
      save();render();
      return;
    }
    if(pos<view.length-1){pos++;render()}else{render();alert('현재 앱카드 학습을 모두 마쳤습니다.')}
  }
  const originalRender=render;
  render=function(){originalRender();renderFlash()};
  flashToggle.onclick=()=>{state.flashMode=!state.flashMode;save();render()};
  function goFlashPrev(){if(!syncViewToActiveFilter()||!view.length)return;pos=(pos-1+view.length)%view.length;render()}
  function goFlashNext(){if(!syncViewToActiveFilter()||!view.length)return;pos=(pos+1)%view.length;render()}
  document.querySelector('#flashPrev').onclick=goFlashPrev;
  document.querySelector('#flashNext').onclick=goFlashNext;

  const flashCard=document.querySelector('#flashCard');
  let swipeStartX=0,swipeStartY=0,swipePointer=null,swipeMoved=false,ignoreCardClick=false;
  flashCard.addEventListener('pointerdown',e=>{
    if(e.pointerType==='mouse'&&e.button!==0)return;
    swipePointer=e.pointerId;swipeStartX=e.clientX;swipeStartY=e.clientY;swipeMoved=false;
    try{flashCard.setPointerCapture(e.pointerId)}catch(_){ }
  });
  flashCard.addEventListener('pointermove',e=>{
    if(e.pointerId!==swipePointer)return;
    const dx=e.clientX-swipeStartX,dy=e.clientY-swipeStartY;
    if(Math.abs(dx)>12&&Math.abs(dx)>Math.abs(dy))swipeMoved=true;
  });
  flashCard.addEventListener('pointerup',e=>{
    if(e.pointerId!==swipePointer)return;
    const dx=e.clientX-swipeStartX,dy=e.clientY-swipeStartY;
    swipePointer=null;
    if(dx<-55&&Math.abs(dx)>Math.abs(dy)*1.2){
      ignoreCardClick=true;
      goFlashNext();
      setTimeout(()=>{ignoreCardClick=false},0);
    }
  });
  flashCard.addEventListener('pointercancel',()=>{swipePointer=null;swipeMoved=false});
  flashCard.onclick=()=>{
    if(ignoreCardClick||swipeMoved){swipeMoved=false;return}
    flip();
  };
  flashCard.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}};
  panel.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>rate(b.dataset.rate));
  render();
})();
</script>

<script id="fast30-study-script">
(()=>{
  /*
    빠른 암기 30문제
    - 반드시 타이핑 후 채점
    - 1회 정답: 15문제 뒤 재확인
    - 2회 연속 정답: 암기 완료
    - 첫 오답: 5문제 뒤 재출제
    - 연속 오답: 3문제 뒤 재출제
    - 창을 닫아도 세트/대기열/현재 위치를 그대로 복원
  */
  state.fast30Mode=!!state.fast30Mode;
  state.fast30SetNumber=Math.max(0,Number(state.fast30SetNumber)||0);
  state.fast30Session=(state.fast30Session&&typeof state.fast30Session==='object')?state.fast30Session:null;
  state.fast30Processed=(state.fast30Processed&&typeof state.fast30Processed==='object')?state.fast30Processed:null;

  // V4의 예전 집중암기 세션은 일반 학습기록에는 손대지 않고 세션 정보만 정리한다.
  if(state.speedTypingMode||state.speedSession||state.speedProcessed){
    state.speedTypingMode=false;state.speedSession=null;state.speedProcessed=null;
  }

  let session=state.fast30Session;
  let processed=state.fast30Processed;

  const toggle=document.createElement('button');
  toggle.id='fast30Toggle';
  toggle.type='button';

  function term(){return norm($('#search')?.value||'')}

  function pFor(key){

  function lastStudyDay(key){return state.wrongMeta?.[key]?.last||state.review?.[key]?.last||state.flashStats?.[key]?.last||state.memoryVerify?.[key]?.marked||''}
  function priorityScore(idx,type){
    const q=BANK[idx],k=keyForIndex(idx),wm=state.wrongMeta[k]||{},freq=Math.max(1,Number(q?.frequency)||1);
    const last=lastStudyDay(k),age=last?Math.max(0,daysBetween(last,localDateKey())):30;
    const overdue=(state.review[k]?.due&&state.review[k].due<=localDateKey())?Math.max(0,daysBetween(state.review[k].due,localDateKey())):0;
    let score=(Number(wm.count)||0)*28+freq*8+Math.min(30,age)+Math.min(30,overdue*4);
    if(type==='review')score+=90;
    if(verifyIsDue(k))score+=130;
    if(state.status[k]==='unmastered')score+=35;
    if(!hasAttempt(k))score+=12;
    return score;

  function autoSelect30(){
    const reviewPool=[],learnPool=[];
    BANK.forEach((q,idx)=>{
      if(!matchesQuestionYear(q))return;
      const k=qkey(q);
      if(state.status[k]==='mastered'){
        if(verifyIsDue(k)||isDueToday(k))reviewPool.push(idx);
      }else learnPool.push(idx);
    });
    reviewPool.sort((a,b)=>priorityScore(b,'review')-priorityScore(a,'review')||a-b);
    learnPool.sort((a,b)=>priorityScore(b,'learn')-priorityScore(a,'learn')||a-b);
    const chosenReview=reviewPool.slice(0,10);
    const chosenLearn=learnPool.slice(0,20);
    const chosen=new Set([...chosenLearn,...chosenReview]);
    const remaining=[
      ...learnPool.slice(chosenLearn.length).map(i=>({i,t:'learn',s:priorityScore(i,'learn')})),
      ...reviewPool.slice(chosenReview.length).map(i=>({i,t:'review',s:priorityScore(i,'review')}))
    ].sort((a,b)=>b.s-a.s||a.i-b.i);
    for(const x of remaining){if(chosen.size>=30)break;chosen.add(x.i)}
    const learn=[...chosen].filter(i=>state.status[keyForIndex(i)]!=='mastered').sort((a,b)=>priorityScore(b,'learn')-priorityScore(a,'learn'));
    const review=[...chosen].filter(i=>state.status[keyForIndex(i)]==='mastered').sort((a,b)=>priorityScore(b,'review')-priorityScore(a,'review'));
    const selected=[];
    // 학습 2문제 : 복습 1문제 비율로 섞어서 체감 난이도를 안정시킨다.
    while(learn.length||review.length){
      for(let n=0;n<2&&learn.length;n++)selected.push(learn.shift());
      if(review.length)selected.push(review.shift());
      if(!learn.length&&review.length)selected.push(...review.splice(0));
    }
    return selected.slice(0,30);

  function persistFast(){

  function selectedStats(){

      const k=keyForIndex(idx),p=pFor(k);
      if(p.done)done++;

      const p=pFor(keyForIndex(idx));

  function stageText(){

  function rotateCandidates(candidates,startIdx){
    if(!candidates.length)return candidates;

  document.addEventListener('keydown',e=>{
    if(!state.fast30Mode)return;
    if(e.key!=='Enter'||e.shiftKey||e.isComposing||e.keyCode===229)return;
    if(e.target.matches('textarea.answer-input')||(e.ctrlKey||e.metaKey)){
      e.preventDefault();e.stopImmediatePropagation();
      if(processed){goNext();return}
      if((e.ctrlKey||e.metaKey)){ $('#check').click();return }
      const inputs=[...document.querySelectorAll('.answer-input')];
      const i=inputs.indexOf(e.target);
      if(i>=0&&i<inputs.length-1)inputs[i+1].focus();
      else $('#check').click();
      return;
    }
    if(!e.target.matches('input,select')){
      e.preventDefault();e.stopImmediatePropagation();
      processed?goNext():$('#check').click();
    }
  },true);

  // 앱카드와 빠른 암기는 동시에 실행하지 않는다.
  const flashBtn=document.querySelector('#flashToggle');
  if(flashBtn)flashBtn.addEventListener('click',e=>{
    if(state.fast30Mode){e.preventDefault();e.stopImmediatePropagation()}
  },true);

  // 학습기록 초기화 후 세션 참조도 함께 정리한다.
  $('#resetConfirmYes')?.addEventListener('click',()=>{
    session=null;processed=null;state.fast30Mode=false;state.fast30Session=null;state.fast30Processed=null;
    document.body.classList.remove('fast30-mode');lockNormalControls(false);setToggleText();
  });

  // 창 재실행 시 진행 중이던 30문제 세트를 같은 위치에서 그대로 복원한다.
  if(state.fast30Mode&&isValidSession(session)){
    state.yearFilter=validYearFilter(session.yearFilter||'all');
    session.kindMap=session.kindMap||{};
    session.selected.forEach(idx=>{const k=keyForIndex(idx);if(!session.kindMap[k])session.kindMap[k]=state.status[k]==='mastered'?'review':'learn'});
    view=session.queue;
    pos=Math.max(0,Math.min(Number(session.cursor)||0,view.length-1));
  }else if(state.fast30Mode){
    state.fast30Mode=false;session=null;processed=null;
  }
  persistFast();save();render();

  // 정답/오답을 확인한 상태로 창을 닫았을 때도 같은 화면에서 이어진다.
  if(state.fast30Mode&&processed&&processed.pos===pos&&processed.key===currentKey()){
    updatePanel(processed.message||'채점된 문제입니다. 다음으로 이동하세요.');
  }
  window.CivilFast30={
    active:()=>!!state.fast30Mode,
    processed:()=>processed,
    finished:()=>!!session?.finished,
    next:goNext,
    nextSet:()=>$('#fast30NextSet').click()
  };
  window.addEventListener('beforeunload',()=>{persistFast();save()});
})();
</script>

<script id="manual-study-navigation">
(()=>{
  'use strict';
  function mode(){return $('#mode')?.value||state.mode||'all'}
  function context(){return `${mode()}|${activeYear()}|${$('#search')?.value||''}`}
  function captureFlash(){
    if(!state.flashMode||!['all','needsStudy','wrong','favorite'].includes(mode()))return null;
    const eligible=filteredIndices(mode(),norm($('#search')?.value||''));
    const allowed=new Set(eligible);
    const indices=[...new Set([...view,...eligible])].filter(i=>allowed.has(i));
    if(!indices.some(i=>state.status[qkey(BANK[i])]!=='mastered'))return null;
    return{signature:context(),index:view[pos],indices};
  }
  function afterFlashRating(origin){
    if(!origin||!state.flashMode||context()!==origin.signature)return false;
    const remaining=origin.indices.filter(i=>state.status[qkey(BANK[i])]!=='mastered');
    const plan=studyNavigationPlan(origin.indices,origin.index,remaining,1);
    if(!plan){render();$('#flashDue').textContent='이 범위의 문제를 모두 암기 완료했습니다.';save();return true;}
    view=mode()==='all'?origin.indices.slice():plan.view;
    pos=view.indexOf(plan.index);save();render();return true;
  }
  window.CivilFlashRepeat={captureFlash,afterFlashRating};
  // No timer, no countdown, and no interception of the Next button.
  // Enter moves between fields or grades; Shift+Enter inserts a newline.
  document.addEventListener('keydown',e=>{
    if(state.fast30Mode||state.flashMode||examActive||e.key!=='Enter'||e.shiftKey||e.isComposing||e.keyCode===229||!e.target.matches?.('.answer-input'))return;
    e.preventDefault();e.stopImmediatePropagation();
    const inputs=[...document.querySelectorAll('.answer-input')],i=inputs.indexOf(e.target);
    if(!e.ctrlKey&&!e.metaKey&&i>=0&&i<inputs.length-1)inputs[i+1].focus();
    else $('#check').click();
  },true);
})();
</script>
