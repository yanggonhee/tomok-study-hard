<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>index.html</title>
<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#172033;--muted:#667085;--line:#d9e1ee;--primary:#2563eb;--good:#15803d;--bad:#dc2626;--safe-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink);min-width:320px}
button,select,input,textarea{font:inherit}
button,select{min-height:44px;touch-action:manipulation}
header{position:sticky;top:0;z-index:20;background:#0f172a;color:white;padding:14px 14px 12px;box-shadow:0 2px 10px #0002}
.wrap{width:min(100%,900px);margin:auto}
h1{font-size:21px;margin:0 0 10px;line-height:1.3}
.tools{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
select,button{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px 12px;font-weight:700;background:white;color:var(--ink)}
button{cursor:pointer}
button:active{transform:scale(.98)}
button.primary{background:var(--primary);color:white;border-color:var(--primary)}
main{padding:16px 14px calc(96px + var(--safe-bottom))}
.status{background:white;border-radius:14px;padding:12px;margin-bottom:12px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center;box-shadow:0 3px 14px #0f172a10}
.status b{display:block;font-size:20px}.status span{font-size:12px;color:var(--muted)}
.card{background:var(--card);border-radius:18px;padding:20px;box-shadow:0 6px 24px #0f172a12;overflow-wrap:anywhere}
.meta{font-size:13px;color:var(--primary);font-weight:800}
.q{font-size:19px;line-height:1.65;font-weight:800;white-space:pre-line;margin:12px 0}
.hint{color:var(--muted);font-size:14px;margin-bottom:12px}
.choices{display:grid;gap:10px}
.subjective{display:none}
.subjective textarea{width:100%;min-height:150px;resize:vertical;border:2px solid var(--line);border-radius:14px;padding:14px;font-size:16px;line-height:1.6;color:var(--ink);background:#fff}
.subjective textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px #2563eb18}
.subjective .subjective-note{margin:8px 0 10px;color:var(--muted);font-size:13px}
.subjective button{margin-top:2px}
label.choice{display:flex;gap:12px;align-items:flex-start;border:2px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;line-height:1.5;min-height:52px;touch-action:manipulation}
label.choice:has(input:checked){border-color:var(--primary);background:#eff6ff}
input{margin-top:3px;width:20px;height:20px;flex:0 0 20px;accent-color:var(--primary)}
.result{margin-top:14px;padding:14px;border-radius:12px;display:none;white-space:pre-line;line-height:1.6;overflow-wrap:anywhere}
.result.good{display:block;background:#ecfdf3;color:var(--good)}
.result.bad{display:block;background:#fef2f2;color:var(--bad)}
.actions{display:flex;gap:8px;margin-top:16px}.actions button{flex:1}
@media(max-width:700px){
  header{padding:12px 10px 10px}
  h1{font-size:18px;margin-bottom:9px}
  .tools{grid-template-columns:1fr 1fr}
  .tools select,.tools button{font-size:14px;padding:9px 8px}
  main{padding:12px 10px calc(94px + var(--safe-bottom))}
  .status{grid-template-columns:repeat(4,1fr);padding:10px 6px;gap:4px;position:sticky;top:123px;z-index:10}
  .status b{font-size:18px}.status span{font-size:11px}
  .card{padding:16px 13px;border-radius:15px}
  .q{font-size:17px;line-height:1.65}
  label.choice{padding:14px 12px;font-size:16px}
  .actions{position:fixed;left:0;right:0;bottom:0;z-index:30;margin:0;padding:10px 10px calc(10px + var(--safe-bottom));background:#ffffffee;backdrop-filter:blur(10px);border-top:1px solid var(--line);box-shadow:0 -4px 18px #0f172a18}
  .actions button{min-height:50px;font-size:15px}
}
@media(max-width:380px){
  .status{grid-template-columns:repeat(2,1fr);top:123px}
  .q{font-size:16px}
  label.choice{font-size:15px}
}
</style></head><body><header><div class="wrap"><h1>토목기사 실기 말따먹기</h1><div class="tools"><select id="answerMode"><option value="choice">객관식</option><option value="subjective">주관식</option></select><select id="year"><option value="all">전체 연도</option></select><select id="mode"><option value="all">전체 문제</option><option value="wrong">오답만</option><option value="unseen">미학습만</option></select><button id="shuffle">문제 섞기</button><button id="reset">기록 초기화</button></div></div></header><main class="wrap"><div class="status"><div><b id="pos">0/0</b><span>진행</span></div><div><b id="score">0</b><span>정답</span></div><div><b id="wrong">0</b><span>오답</span></div><div><b id="rate">0%</b><span>정답률</span></div></div><section class="card"><div class="meta" id="meta"></div><div class="q" id="q"></div><div class="hint" id="hint"></div><div class="choices" id="choices"></div><div class="subjective" id="subjective"><textarea id="subjectiveAnswer" placeholder="답을 직접 입력하세요."></textarea><div class="subjective-note" id="subjectiveNote"></div><button class="primary" id="subjectiveCheck">주관식 채점</button></div><div id="result" class="result"></div><div class="actions"><button id="prev">이전</button><button class="primary" id="check" style="display:none">정답 확인</button><button id="next">다음</button></div></section></main>
<script>

let records=JSON.parse(localStorage.getItem('civilQuizRecords')||'{}'); let list=[],idx=0,locked=false;
const $=id=>document.getElementById(id);
const norm=s=>String(s||'').replace(/\s|[.,:;()\[\]{}\-_/·ㆍ!?~'"“”‘’]/g,'').toLowerCase();
function init(){[...new Set(DATA.map(x=>x.year))].sort().forEach(y=>$('year').insertAdjacentHTML('beforeend',`<option>${y}</option>`));apply();}
function apply(){let y=$('year').value,m=$('mode').value;list=DATA.filter(x=>(y==='all'||x.year===y)&&(m==='all'||(m==='wrong'&&records[x.id]?.ok===false)||(m==='unseen'&&!records[x.id])));idx=0;render();}
function render(){
  locked=false;$('next').classList.remove('primary');
  if(!list.length){$('meta').textContent='';$('q').textContent='조건에 맞는 문제가 없습니다.';$('choices').innerHTML='';$('subjective').style.display='none';$('hint').textContent='';$('result').className='result';$('result').textContent='';update();return;}
  let x=list[idx],subjective=$('answerMode').value==='subjective';
  $('meta').textContent=`${x.session} · 문제 ${x.id}`;$('q').textContent=x.question;
  $('result').className='result';$('result').textContent='';
  if(subjective){
    $('choices').style.display='none';$('subjective').style.display='block';
    $('subjectiveAnswer').value='';$('subjectiveAnswer').disabled=false;$('subjectiveCheck').disabled=false;
    $('subjectiveAnswer').placeholder=x.required>1?`정답 ${x.required}개를 줄바꿈하여 입력하세요.`:'답을 직접 입력하세요.';
    $('subjectiveNote').textContent=x.required>1?`답을 한 줄에 하나씩 입력하세요. ${x.required}개 이상 작성할 수 있습니다.`:'답을 입력한 뒤 주관식 채점 버튼을 누르세요.';
    $('hint').textContent='주관식 모드 · 띄어쓰기와 일반 문장부호는 채점에서 무시됩니다.';
  }else{
    $('subjective').style.display='none';$('choices').style.display='grid';
    $('hint').textContent=x.required>1?`정답 ${x.required}개를 모두 선택하면 바로 채점됩니다.`:'답을 선택하면 즉시 채점됩니다.';
    $('choices').innerHTML=x.choices.map((c,i)=>`<label class="choice"><input type="${x.required>1?'checkbox':'radio'}" name="answer" value="${i}"><span>${c}</span></label>`).join('');

  }
  update();
}
function handleChoice(){if(locked||!list.length)return;let x=list[idx];let count=document.querySelectorAll('input[name=answer]:checked').length;if(x.required===1||count===x.required)checkChoice();}
function saveResult(ok){let x=list[idx];records[x.id]={ok,at:Date.now(),type:$('answerMode').value};localStorage.setItem('civilQuizRecords',JSON.stringify(records));if(!ok&&navigator.vibrate)navigator.vibrate([120,60,120]);$('next').classList.add('primary');update();}
function checkChoice(){
  if(locked||!list.length)return;let x=list[idx];let inputs=[...document.querySelectorAll('input[name=answer]')];let chosen=inputs.filter(e=>e.checked).map(e=>x.choices[+e.value]);if(chosen.length!==x.required)return;
  locked=true;let correct=x.answers.map(norm),got=chosen.map(norm);let ok=got.every(v=>correct.includes(v));saveResult(ok);inputs.forEach(e=>e.disabled=true);
  document.querySelectorAll('label.choice').forEach((label,i)=>{let value=norm(x.choices[i]);if(correct.includes(value))label.style.borderColor='#15803d';else if(inputs[i].checked)label.style.borderColor='#dc2626';});
  $('result').className='result '+(ok?'good':'bad');$('result').textContent=(ok?'정답입니다!':'오답입니다.')+'\n정답: '+x.answers.join(' / ')+'\n정답을 확인한 뒤 아래의 다음 버튼을 눌러주세요.';
}
function checkSubjective(){
  if(locked||!list.length)return;let x=list[idx];let raw=$('subjectiveAnswer').value.trim();if(!raw){alert('답을 입력해주세요.');$('subjectiveAnswer').focus();return;}
  let user=raw.split(/\n|;/).map(v=>v.trim()).filter(Boolean),answers=x.answers.map(norm),matched=[];
  for(const entry of user){let n=norm(entry);if(!n)continue;let hit=answers.findIndex((a,i)=>!matched.includes(i)&&(a===n||a.includes(n)||n.includes(a)));if(hit>=0)matched.push(hit);}
  let ok=matched.length>=x.required;locked=true;saveResult(ok);$('subjectiveAnswer').disabled=true;$('subjectiveCheck').disabled=true;
  let missed=x.answers.filter((_,i)=>!matched.includes(i));

$('shuffle').onclick=()=>{list.sort(()=>Math.random()-.5);idx=0;render();};$('reset').onclick=()=>{if(confirm('학습 기록을 모두 지울까요?')){records={};localStorage.removeItem('civilQuizRecords');apply();}};init();
