<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>서술형 작성</title>
<meta name="theme-color" content="#1769d2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="서술형 작성">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<div class="app">
<header>
  <div class="title-row">
    <h1>서술형 작성</h1>
    <button id="manageToggle" class="ghost">학습 관리</button>
  </div>
  <section id="managePanel" class="manage-panel">
    <div class="stats">
      <span id="progress" class="pill"></span>
      <span id="score" class="pill"></span>
      <span id="wrongCount" class="pill"></span>
    </div>
    <div class="toolbar">
      <select id="mode">
        <option value="all">전체 445문항</option>
        <option value="wrong">오답만</option>
        <option value="fav">즐겨찾기</option>
        <option value="mastered">숙지</option>
        <option value="uncertain">애매</option>
        <option value="unmastered">미숙지</option>
      </select>
      <input id="search" type="search" placeholder="문제번호·연도·내용 검색">
      <button id="shuffle">랜덤</button>
      <button id="reset">기록 초기화</button>
    </div>
  </section>
</header>

<main class="card">
  <div class="meta">
    <div>
      <strong id="number"></strong>
      <span id="label" class="tag"></span>
    </div>
    <span id="frequency" class="stars"></span>
  </div>

  <div id="question" class="question"></div>

  <section class="answer-section">
    <h2>답안 작성</h2>
    <div id="answers"></div>
  </section>

  <nav class="answer-actions" aria-label="문제 조작">
    <button id="prev">이전</button>
    <button id="fav">☆ 즐겨찾기</button>
    <button id="check" class="primary">채점하기</button>
    <button id="reveal" class="good">정답 확인</button>
    <button id="next">다음</button>
  </nav>

  <div id="result" class="result"></div>
  <section id="official" class="official">
    <h2>모범답안·해설</h2>
    <div id="officialContent"></div>
  </section>

  <div class="status-row">
    <button id="markMastered">숙지</button>
    <button id="markUncertain">애매</button>
    <button id="markUnmastered">미숙지</button>
  </div>
</main>
</div>
<script src="./js/data.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
