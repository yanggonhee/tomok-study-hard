:root{--bg:#f4f6f8;--card:#fff;--text:#17202a;--muted:#65717e;--line:#dfe5eb;--primary:#1667d9;--good:#16833b;--bad:#c62828;--warn:#a05a00}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;color:var(--text)}.app{max-width:820px;margin:auto;padding:14px 14px 110px}header{position:sticky;top:0;z-index:5;background:rgba(244,246,248,.95);backdrop-filter:blur(10px);padding:10px 0}h1{font-size:20px;margin:0 0 8px}.stats,.toolbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.pill{background:#e9eef5;border-radius:999px;padding:6px 10px;font-size:13px}button,select{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;font-size:15px}button.primary{background:var(--primary);color:#fff;border-color:var(--primary)}button.good{background:var(--good);color:#fff;border-color:var(--good)}button:disabled{opacity:.45}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:12px;box-shadow:0 4px 18px rgba(0,0,0,.04)}.meta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:13px}.question{white-space:pre-wrap;font-size:18px;line-height:1.65;margin:18px 0}.stars{color:#d08000;font-weight:700}.answers{display:grid;gap:10px}textarea{width:100%;min-height:54px;resize:vertical;border:1px solid #bdc7d2;border-radius:10px;padding:12px;font:inherit;font-size:16px}textarea:focus{outline:2px solid #8bb8f2;border-color:transparent}.result{margin-top:14px;padding:12px;border-radius:10px;display:none;white-space:pre-wrap;line-height:1.6}.result.show{display:block}.result.ok{background:#e8f5eb;color:#116b2e}.result.partial{background:#fff4df;color:#7b4600}.result.bad{background:#fdecec;color:#9f1f1f}.official{display:none;margin-top:14px;border-top:1px dashed var(--line);padding-top:14px}.official.show{display:block}.official ol{padding-left:24px}.bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:10px max(12px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));z-index:10}.bottomin{max-width:820px;margin:auto;display:grid;grid-template-columns:1fr 1fr 1.2fr 1.2fr;gap:7px}.hide{display:none!important}@media(max-width:520px){.app{padding:10px 10px 105px}.card{padding:15px}.question{font-size:17px}button,select{font-size:14px;padding:9px}.bottomin{grid-template-columns:1fr 1fr 1fr 1fr}}

<script>const BANK=[{"label": "14-1", "question": "연약지반상에 성토할 때 성토재료가 굵은 모래, 자갈, 암석과 같이 투수성이고, 기초지반 지지력이 크지 않은 경우 먼저 sand mat(부사)를 깔고 성토하는데 이때에 sand mat의 중요한 역할 3가지를 쓰시오.", "answers": ["연약층 압밀을 위한 상부배수층을 형성", "시공기계의 주행성을 확보", "지하배수층이 되어 지하수위를 저하", "지하수위 상승시 횡방향 배수로 성토지반의 연약화 방지"], "required": 3, "source": "일반", "id": 1, "frequency": 2}, {"label": "14-1", "question": "심발공(심빼기 발파공)의 종류 중 4가지만 쓰시오.", "answers": ["V컷", "번컷", "노컷", "스윙컷", "피라미드컷"], "required": 4, "source": "일반", "id": 2, "frequency": 2}, {"label": "14-1", "question": "터널 보강재의 하나인 강지보재의 종류를 3가지만 쓰시오.", "answers": ["H형강 지보재", "격자 지보재", "U형 지보재"], "required": 3, "source": "일반", "id": 3, "frequency": 1}, {"label": "14-1", "question": "도로 노상의 지지력을 평가할 수 있는 현장시험 평가방법을 3가지만 쓰시오.", "answers": ["CBR(CBR시험)", "K값(평판재하시험 : PBT)", "Cone값(콘관입시험 : CPT)", "N치(표준관입시험 : SPT)"], "required": 3, "source": "일반", "id": 4, "frequency": 5}, {"label": "14-1", "question": "수분이 많은 점토층에 반투막 중공원통을 넣고 그 안에 농도가 큰 용액을 넣어서 점토 속의 수분을 빨아내는 방법으로 상재하중 없이 압밀을 촉진시킬 수 있는 지반개량 공법은?", "answers": ["침투압공법(MAIS 공법)"], "required": 1, "source": "일반", "id": 5, "frequency": 1}, {"label": "14-1", "question": "일반적으로 차량의 충격위험을 방지하는 충격흡수시설의 종류를 3가지만 쓰시오.", "answers": ["철제드럼", "모래채우기 플라스틱 통", "하이드로셀 샌드위치(Hi-dro cell sandwich)", "하이드로셀 클러스터(Hi-dro cell cluster)"], "required": 3, "source": "일반", "id": 6, "frequency": 1}, {"label": "14-1", "question": "강제치환공법을 간단히 설명하시오.", "answers": ["직접 양질토를 연약지반 위에 투하하여 그 자중으로 기초지반에 파괴를 일으켜 연약토를 주위로 배제시킴으로써 지반을 개량하는 공법"], "required": 1, "source": "일반", "id": 7, "frequency": 1}, {"label": "14-1", "question": "강제치환공법의 단점 3가지를 쓰시오.", "answers": ["잔류침하가 예상된다", "개량효과의 확실성이 없다.", "이론적이며 정량적인 설계가 어렵다.", "균일하게 치환하기가 어렵다.", "압출에 의한 사면선단의 팽창이 일어난다."], "required": 3, "source": "일반", "id": 8, "frequency": 1}, {"label": "14-2", "question": "콘크리트포장은 콘크리트 균열을 조절하기 위해 설치하는 줄눈 및 철근의 유무에 따라 그 종류가 구분되는데 그 종류를 3가지만 기술하시오.", "answers": ["무근 콘크리트포장(JCP)", "철근 콘크리트포장(JRCP)", "연속철근 콘크리트포장(CRCP)", "프리스트레스 콘크리트포장(PCP)"], "required": 3, "source": "일반 법", "변형 특성으로 규정하는 방법"], "required": 5, "source": "일반", "id": 203, "frequency": 3}, {"label": "19-1", "question": "철도, 수도, 도로 등의 횡단, 기타 개착공법(open cut)이 곤란한 경우에 사용하는 것이며, 소구경의 강관을 입갱 사이에 삽입하거나 또는 당김으로써 토층에 관을 매설하는 이 공법은?", "answers": ["프론트젝킹공법(front jacking method)"], "required": 1, "source": "일반", "id": 204, "frequency": 1}, {"label": "19-1", "question": "교량의 상부 구조물을 교대 또는 재1교각의 후방에 설치한 주형 제작장에서 프리캐스트세그먼트를 연속적으로 제작하여 직선 또는 일정 곡률반지름의 교량을 가설하는 공법을 무엇이라 하는가?", "answers": ["압출공법(ILM 공법 : Incremental Launching Method)"], "required": 1, "source": "일반", "id": 205, "frequency": 1}, {"label": "19-1", "question": "필댐(fill dam)의 필터재(filter)의 역할을 3가지만 쓰시오.", "answers": ["물만 통과시키고 토립자의 유출방지", "역학적 완충역할", "코어재의 자기치유작용을 지원"], "required": 3, "source": "일반", "id": 206, "frequency": 1}, {"label": "19-1", "question": "다음 그림은 골재의 함수상태를 나타낸 그림이다. ( ) 안에 알맞은 말을 적어 넣으시오. (p.3-232)", "answers": ["유효흡수량", "함수량", "표면수량", "표면건조 포화상태"], "required": 1, "source": "일반", "id": 207, "frequency": 1}, {"label": "19-2", "question": "아스팔트 포장시 기존의 포장면 또는 아스팔트 안정처리기층에 역청재료를 살포하여 그 위에 포설할 아스팔트 혼합물층과 부착성을 높이는 것을 무엇이라고 하는가?", "answers": ["택코트(tack coat)"], "required": 1, "source": "일반", "id": 208, "frequency": 1}, {"label": "19-2", "question": "연약지반 처리공법 중 Vertical Drain 공법으로서는 Paper Drain과 Sand Drain을 많이 사용하고 있으나, 근래에는 시공상과 공기 및 재료구득의 난이 등으로 인하여 Paper Drain 공법 채택이 중가하고 있다. Paper Drain 공법이 Sand Drain 공법과 비교하여 유리한 점 5가지를 쓰시오.", "answers": ["공사비가 저렴하다.", "시공속도가 빠르다.", "배수효과가 양호하다.", "Drain 단면이 깊이 방향에 대해서 일정하다.", "타설에 의해서 주변 지반을 교란하지 않는다."], "required": 5, "source": "일반", "id": 209, "frequency": 1}, {"label": "19-2", "question": "Asphalt 혼합물의 Marshall 안정도 시험에 대한 아래 내용 중 ( )에 들어갈 알맞은 수치를 쓰시오.", "answers": ["공시체를 ( 1 )분 동안 수조 속에 침수시켜, 가열 아스팔트 공시체 온도가 ( 2 )°C로 유지하도록 한다.", "재하 잭 혹은 분당 ( 3 )mm의 비율로 움직이는 시험기 두부를 가진 시험기로 공시체의 일정한 비율로 하중을 가한다.", "(1)30", "(2) 60 ± 1", "(3) 50.8"], "required": 1, "source": "일반", "id": 210, "frequency": 1}, {"label": "19-2", "question": "댐의 기초처리 공사 시 Grouting 공사의 주입재료를 3가지만 쓰시오.", "answers": ["시멘트 용액", "벤토나이트와 점토 용액", "아스팔트 용액", "약액"], "required": 3, "source": "일반", "id": 211, "frequency": 1}, {"label": "19-2", "question": "암거 매설공법을 고속도로 및 철도하부로 횡단하여 암거구조물을 설치할 경우 개착공법에 의하지 않고 양측에 발진기지를 설치하여 함체를 직접 견인시켜 구조물 안으로 들어오는 토사를 굴착시켜 소정의 구조물을 설치함으로써 상부교통에 지장을 주지 않고 시공하는 공법은?", "answers": ["프론트젝킹공법(front jacking method)"], "required": 1, "source": "일반", "id": 212, "frequency": 1}, {"label": "19-2", "question": "굳지 않는 콘크리트의 워커빌리티(Workability) 측정방법을 3가지 쓰시오.", "answers": ["슬럼프 시험(slump test)", "흐름시험(flow test)", "구관입 시험(ball penetration test)", "리몰딩 시험(remolding test)", "비비시험(Vee - Bee test)", "다짐계수 시험(compacting factor test)"], "required": 3, "source": "일반", "id": 213, "frequency": 1}, {"label": "19-2", "question": "콘크리트포장은 콘크리트 균열을 조절하기 위해 설치하는 줄눈 및 철근의 유무에 따라 그 종류가 구분되는데 그 종류를 3가지만 기술하시오.", "answers": ["무근 콘크리트포장(JCP)", "철근 콘크리트포장(JRCP)", "연속철근 콘크리트포장(CRCP)", "프리스트레스 콘크리트포장(PCP)"], "required": 3, "source": "일반", "id": 214, "frequency": 3}, {"label": "19-2", "question": "하류측의 하천이나 하수도시설의 유하능력이 부족하게 되는 경우 일단 유출우수를 저류하여 조정을 하기 위한 시설은?", "answers": ["우수조정지"], "required": 1, "source": "일반", "id": 215, "frequency": 1}, {"label": "19-2", "question": "도로공사의 성토작업시 노체시공의 현장 품질관리시험종목 중 가장 중요한 것을 3가지만 쓰시오.", "answers": ["흙의 함수량 시험", "현장밀도시험", "평판재하시험", "다짐시험"], "required": 3, "source": "일반", "id": 216, "frequency": 1}, {"label": "19-2", "question": "다음 용어에 관한 정의를 간단히 쓰시오.\n\n최적심도", "answers": ["분화구가 최대 체적을 가질 때의 장약 깊이"], "required": 1, "source": "◎", "id": 217, "frequency": 1}, {"label": "19-2", "question": "다음 용어에 관한 정의를 간단히 쓰시오.\n\n누두지수", "answers": ["누두공의 형상을 나타내는 지수", "n = R / W", "여기서, W : 최소저항선(장약깊이), R : 누두 반경(누두공 반지름)"], "required": 1, "source": "◎", "id": 218, "frequency": 1}, {"label": "19-3", "question": "말뚝의 지지력을 산정하는 방법 3가지를 쓰시오.", "answers": ["동역학적 공식에 의한 방법", "정역학적 공식에 의한 방법", "정재하시험에 의한 방법"], "required": 3, "source": "일반", "id": 219, "frequency": 4}, {"label": "19-3", "question": "필댐의 종류를 3가지만 쓰시오.", "answers": ["흙댐(earth fill dam)", "록필댐(rock fill dam) ency": 3}, {"label": "19-3", "question": "다음 준설기계에 대한 설명에 적합한 준설선의 명칭을 쓰시오.\n\n준설과 매립을 동시에 신속하게 시공할 수 있고 해저 토사를 회전형 Cutter로 깎아 펌프로 흡입하여 매립지로 배송하는 준설선", "answers": ["펌프 준설선(pump dredger)"], "required": 1, "source": "◎", "id": 229, "frequency": 2}, {"label": "19-3", "question": "다음 준설기계에 대한 설명에 적합한 준설선의 명칭을 쓰시오.\n\n자항식 펌프 준설선에서 선체의 일부에 토창을 설치하여 토운선을 사용하지 않고 제거한 토사를 적재하였다가 사토장까지 항행하여 토사를 버리는 준설선", "answers": ["호퍼 준설선(hopper dredger)"], "required": 1, "source": "◎", "id": 230, "frequency": 1}, {"label": "19-3", "question": "다음 준설기계에 대한 설명에 적합한 준설선의 명칭을 쓰시오.\n\n해저의 암반이나 암초를 쇄암추나 쇄암기의 끝에 특수한 강철로 된 날끝을 달아 암석을 파쇄하는 준설선", "answers": ["쇄암 준설선(rock cutter dredger)"], "required": 1, "source": "◎", "id": 231, "frequency": 2}, {"label": "19-3", "question": "다음 준설기계에 대한 설명에 적합한 준설선의 명칭을 쓰시오.\n\n파워셔블(power shovel)을 대선에 설치해 사암이나 혈암 등의 수중에 적합한 준설선", "answers": ["디퍼 준설선(dipper dredger)"], "required": 1, "source": "◎", "id": 232, "frequency": 2}, {"label": "19-3", "question": "흙의 애터버그(Atterberg)한계의 종류 3가지를 쓰시오.", "answers": ["액성한계", "소성한계", "수축한계"], "required": 3, "source": "일반", "id": 233, "frequency": 3}, {"label": "19-3", "question": "다음은 암반층의 무엇을 말하는지 쓰시오.", "answers": ["암반내에 규칙적으로 깨져있는 불연속면으로 현저하게 움직인 면이 없는 것을 ( 1 )이라 하며, 불연속면을 따라 움직인 불연속면을 ( 2 )이라 한다.", "(1) 절리(joint)", "(2) 단층(fault)"], "required": 1, "source": "일반", "id": 234, "frequency": 1}, {"label": "20-1", "question": "토목시공에서 사용하고 있는 토목섬유의 주요 기능을 4가지만 쓰시오.", "answers": ["배수기능", "여과기능", "분리기능", "보강기능"], "required": 4, "source": "일반", "id": 235, "frequency": 3}, {"label": "20-1", "question": "장대교량에 사용되는 사장교는 주부재인 케이블의 교축방향 배치방식에 따라 크게 4가지로 분류되는데 이를 쓰시오.", "answers": ["부채형(fan type)", "하프형(harp tyep)", "스타형(star type)", "방사형(radiating type)"], "required": 4, "source": "일반", "id": 236, "frequency": 3}, {"label": "20-1", "question": "벤토나이트 안정액을 사용하여 벽면을 보호하면서 지반을 굴착하고 공내에 철근 콘크리트벽을 구축하여 토압과 수압에 모두 견딜 수 있는 흙막이 벽의 명칭을 쓰고, 이 흙막이 벽의 장점을 3가지만 쓰시오.\n\n이 흙막이벽의 명칭을 쓰시오", "answers": ["지하연속벽(Slurry wall)"], "required": 3, "source": "◎", 는 방법을 3가지만 쓰시오.", "answers": ["치환공법으로 동결되지 않는 흙으로 바꾸는 방법", "지하수위 상층에 조립토층을 설치하는 방법", "배수구 설치로 지하수위를 저하시키는 방법", "흙 속에 단열재료를 매입하는 방법", "지표부의 흙을 안정처리하는 방법"], "required": 3, "source": "일반", "id": 271, "frequency": 1}, {"label": "20-3", "question": "현장타설콘크리트 말뚝에서 기계적인 굴착방법 3가지를 쓰시오.", "answers": ["베노토(Benoto)공법", "RCD(역순환)공법", "어스 드릴(Earth drill)공법"], "required": 3, "source": "일반", "id": 272, "frequency": 1}, {"label": "20-3", "question": "Sand drain을 연약지반에 타설하는 방법을 3가지만 쓰시오.\n1. 압축공기식 케이싱 방법\n2. Water jet식 케이싱 방법\n3. Rotary boring에 의한 방법\n4. Earth auger에 의한 방법\n\n​20-3 x - R 관리도는 표준값이 정해져 있는 관리용 관리도의 경우와 표준값이 정해져 있지 않은 해석용 관리도의 경우로 나누어 설명될 수 있다. 이 때 x - R 관리도를 작성하는 기준 2가지를 쓰시오.\n1. 중심선(CL)\n2. 관리한계선(UCL, LCL)\n\n20-4, 5 교대 뒷쪽에 설치하는 답괘판(approach slab)을 설치하는 목적을 쓰시오.\n부등 침하 방지\n\n20-4, 5 숏크리트 타설 시 뿜어붙일 면에 대한 사전처리작업을 3가지만 쓰시오.\n1. 적당한 습윤상태를 유지한다.\n2. 벽면은 될수록 평면이 되도록 마무리한다.\n3. 뿜어붙이기 전에 흙, 부석 등 청소를 한다.\n4. 뿜기면의 용수는 배수처리 한다.\n\n20-4, 5 공기케이슨 공법과 비교하였을 때 오픈케이슨 공법의 시공상 단점을 3가지만 쓰시오.\n1. 선단의 연약토 제거 및 토질상태 파악이 어렵다.\n2. 큰 전석이나 장애물이 있는 경우 침하작업이 지연된다.\n3. 굴착시 히빙이나 보일링 현상의 우려가 있다.\n4. 경사가 있을 경우는 케이슨이 경사질 염려가 있다.\n5. 저부 콘크리트가 수중시공이 되어 불충분하게 되기 쉽다.\n\n20-4, 5 프리스트레스 콘크리트(PSC)말뚝의 장점 4가지를 쓰시오.\n1. 신뢰성이 크다.\n2. 균열이 잘 생기지 않는다.\n3. 횜량을 받았을 때 휨량이 적다.\n4. 인장파괴의 발생 방지에 효력이 있다.\n5. 길이의 조절이 비교적 쉽다.\n\n20-4, 5 시멘트 콘크리트 포장공법 중 단위수량이 적은 낮을 슬럼프(slump)의 된비빔 콘크리트를 토공에서와 같이 다져서 시공하는 공법으로 건조수축이 작고 줄눈간격을 줄일 수 있으며, 공기단축이 가능한 반면에 포장표면의 평탄성이 결여되는 단점이 있는 포장 공법은?\n전압(롤러다짐)콘크리트 포장공법(RCCP : roller compacted pavement)\n\n20-4, 5 댐 구조물이 물 속 또는 물 옆에 축조되는 경우 건조 상태의 작업(dry work)을 하기 위하여 물을 배재하는 구조물을 설치하는데 이것을 무엇이라고 하는가?\n가체절공(가물막이 : coffer dam)\n\n20-4, 5 토목시공에서 사용하고 있는 토목섬유의 주요 기능을 4가지만 쓰시오.\n1. 배수기능\n2. 여과기능\n3. 분리기능\n4. 보강기능\n\n20-4, 5 최근 포장설계시 노상지지력 계수, CBR 대신에 사용되는 포장재료 물성으로서 동적시험에 의해 결정되는 탄성물성은 무엇인가?\n동탄성계수(Mr : Resilient Modulus)\n\n20-4, 5 유수의 흐름방향과 유속을 제어하여 하안, 제방의 침식현상을 방지하기 위해 호안이나 하안 전면부에 설치하는 구조물을 무엇이라 하는가?\n수제(spur : dike groin)\n\n20-4, 5 다음은 무엇에 대한 정의인가를 쓰시오.\n\n지하수위 아래 물에 잠긴 구조물 부피 만큼의 정수압이 상향으로 작용   $('#label').textContent=`${q.label} · 원문 #${q.id}`;
  $('#frequency').textContent=q.frequency>1?`출제빈도 ${'★'.repeat(Math.min(q.frequency,5))} (${q.frequency}회)`:'출제빈도 ★ (1회)';
  $('#question').textContent=q.question;
  const box=$('#answers');box.innerHTML='';
  const draft=state.drafts[q.id]||[];
  for(let i=0;i<q.required;i++){
    const ta=document.createElement('textarea');
    ta.placeholder=q.required>1?`${i+1}번째 답 입력`:'답을 입력하세요';
    ta.autocomplete='off';
    ta.value=draft[i]||'';
    ta.addEventListener('input',()=>{clearTimeout(window.__draftTimer);window.__draftTimer=setTimeout(saveDraft,250)});
    box.appendChild(ta)
  }
  $('#result').className='result';$('#result').textContent='';
  $('#official').className='official';
  $('#officialList').innerHTML=q.answers.map(a=>`<li>${escapeHtml(a)}</li>`).join('');
  $('#fav').textContent=state.fav[q.id]?'★ 즐겨찾기':'☆ 즐겨찾기';
  $('#prev').disabled=pos===0;$('#next').disabled=pos===order.length-1;
  save();
  window.scrollTo({top:0,behavior:'smooth'})
}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function grade(){
  saveDraft();
  const q=current(),users=[...document.querySelectorAll('textarea')].map(x=>x.value.trim()).filter(Boolean);
  let used=new Set(),hits=[];
  for(const u of users){let hit=-1;for(let i=0;i<q.answers.length;i++)if(!used.has(i)&&match(u,q.answers[i])){hit=i;break}if(hit>=0){used.add(hit);hits.push('⭕ '+u)}else hits.push('❌ '+u)}
  const correct=used.size,need=q.required;
  state.done[q.id]=true;if(correct>=need)delete state.wrong[q.id];else state.wrong[q.id]=true;save();
  const r=$('#result');r.className='result show '+(correct>=need?'ok':correct?'partial':'bad');
  r.textContent=`${correct} / ${need}개 정답\n`+hits.join('\n')+(correct<need?`\n빠진 정답: ${need-correct}개`:'\n정답입니다.');
  $('#wrongCount').textContent=`오답 ${Object.keys(state.wrong).length}`
}
$('#check').onclick=grade;
$('#reveal').onclick=()=>$('#official').classList.toggle('show');
$('#next').onclick=()=>{if(pos<order.length-1){saveDraft();pos++;render()}};
$('#prev').onclick=()=>{if(pos>0){saveDraft();pos--;render()}};
$('#fav').onclick=()=>{saveDraft();const id=current().id;state.fav[id]=!state.fav[id];if(!state.fav[id])delete state.fav[id];save();render()};
$('#mode').onchange=applyMode;
$('#shuffle').onclick=()=>{saveDraft();for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}pos=0;save();render()};
$('#reset').onclick=()=>{if(confirm('오답·즐겨찾기·풀이 기록·현재 위치를 모두 초기화할까요?')){localStorage.removeItem(STORAGE_KEY);localStorage.removeItem('civilQuizState_v2');localStorage.removeItem('civilQuizState');location.reload()}};
window.addEventListener('beforeunload',saveDraft);
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveDraft()});
$('#mode').value=['all','wrong','fav'].includes(state.mode)?state.mode:'all';
order=restoreOrder(state.order,$('#mode').value);if(!order.length){$('#mode').value='all';order=BANK.map((_,i)=>i)}
let restoredPos=-1;
if(state.currentQuestionId!=null)restoredPos=order.findIndex(i=>BANK[i].id===state.currentQuestionId);
pos=restoredPos>=0?restoredPos:Math.min(Math.max(state.pos,0),Math.max(order.length-1,0));

// PWA 설치 및 오프라인 업데이트
let deferredInstallPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;$('#installApp').classList.remove('hide')});
$('#installApp').onclick=async()=>{if(!deferredInstallPrompt)return;deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;$('#installApp').classList.add('hide')};
window.addEventListener('appinstalled',()=>$('#installApp').classList.add('hide'));
if('serviceWorker' in navigator){
  window.addEventListener('load',async()=>{
    try{
      const reg=await navigator.serviceWorker.register('./sw.js');
      reg.addEventListener('updatefound',()=>{const w=reg.installing;if(w)w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)$('#pwaNotice').classList.add('show')})});
    }catch(e){console.warn('Service worker registration failed',e)}
  });
  navigator.serviceWorker.addEventListener('controllerchange',()=>location.reload());
}
$('#reloadApp').onclick=async()=>{const reg=await navigator.serviceWorker.getRegistration();if(reg&&reg.waiting)reg.waiting.postMessage({type:'SKIP_WAITING'});else location.reload()};
render();</script></body></html>
