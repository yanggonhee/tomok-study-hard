/* 2026-07 한손 조작 중심 초간결 UI */
:root{
  --black:#111;--text:#222;--dark:#3f3f3f;--mid:#777;
  --line:#dedede;--line-dark:#bdbdbd;--soft:#f4f4f4;--soft-2:#fafafa;--white:#fff
}
html{background:#f2f2f2}
body{background:#f2f2f2;padding-bottom:calc(82px + env(safe-area-inset-bottom))}
.app{width:min(100%,760px);padding:4px 6px 0}
header{position:sticky;top:0;z-index:30;margin:0 -2px 5px;padding:4px 2px 5px;background:rgba(242,242,242,.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.title-row{gap:8px;min-height:36px}
h1{font-size:18px;line-height:1.1;margin:0 0 4px;letter-spacing:-.4px}
.ghost{min-width:48px;height:32px;padding:0 9px;border-radius:8px;font-size:12px;background:#fff}
.progress-track{height:3px;border-radius:0;background:#d6d6d6}
.progress-bar{background:#4b4b4b}
.manage-panel{margin-top:5px;padding:7px;border-radius:9px;box-shadow:none}
.stats{gap:4px;margin-bottom:5px}.pill{padding:3px 7px;font-size:11px}
.toolbar{gap:4px}.toolbar select,.toolbar input,.toolbar button{min-height:34px;height:34px;padding:4px 7px;border-radius:7px;font-size:12px}
.toolbar input{min-width:130px}
.card{padding:8px 8px 10px;border-radius:10px;border:1px solid var(--line);box-shadow:none}
.meta{align-items:center;margin-bottom:5px}
#number{font-size:24px;letter-spacing:-.5px}.tag{padding:3px 7px;font-size:10px}.stars{font-size:11px}
.question{padding:8px 3px 10px;border:0;border-bottom:1px solid var(--line);border-radius:0;background:#fff;font-size:15px;line-height:1.5}
.question img{margin:6px auto}
.answer-section{margin-top:7px}.section-title-row{margin-bottom:4px}
.section-title-row h2{font-size:13px}.autosave{font-size:10px}
.answer-item{margin-bottom:4px}.answer-label{font-size:12px;margin-bottom:2px}
textarea.answer-input{min-height:35px;height:35px;max-height:160px;padding:6px 8px;border-radius:7px;font-size:14px;line-height:1.35}
.result,.official{margin-top:6px;padding:8px;border-radius:8px;font-size:13px}
.official h2{font-size:14px}.official-group{padding:6px 0;line-height:1.5}.mnemonic{margin-top:7px;padding:8px;border-radius:7px}
.control-dock{
  position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:100;
  width:min(100%,760px);margin:0;padding:5px 7px calc(5px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.98);border-top:1px solid #cfcfcf;
  box-shadow:0 -2px 10px rgba(0,0,0,.06);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)
}
.status-row{gap:4px;margin:0 0 4px}.status-row button{height:30px;border-radius:7px;font-size:11px;padding:0 2px;font-weight:750}
.status-row button.active{border:1px solid #555;background:#dedede;font-weight:900}
.answer-actions{gap:4px}.answer-actions button{height:38px;border-radius:8px;font-size:13px;padding:0 2px}
.answer-actions #check,.answer-actions #next{font-weight:900;border-color:#777;background:#ececec}
.answer-actions #next{background:#dcdcdc}
button:active{transform:none;background:#d7d7d7}
.answer-input.auto-corrected{color:#444;background:#ededed;border-color:#777;font-weight:850;text-decoration:none}
@media(max-width:560px){
  body{padding-bottom:calc(80px + env(safe-area-inset-bottom))}
  .app{padding:3px 4px 0}.card{padding:7px 7px 9px}.question{font-size:14.5px;padding:7px 2px 8px}
  .control-dock{padding-left:5px;padding-right:5px}.status-row button{height:29px;font-size:10.5px}.answer-actions button{height:37px;font-size:12.5px}
  textarea.answer-input{font-size:14px}
}

<div class="app">
<header>

<option value="taltal">탈탈 315문항</option>

}

function keywords(s){const raw=(s||'').match(/[가-힣]+|[a-zA-Z]+|[0-9.]+/g)||[];let ks=raw.map(cleanToken).filter(x=>x.length>=2&&!STOP_WORDS.has(x));if(!ks.length){const n=norm(s);if(n.length>=2)ks=[n]}return [...new Set(ks)]}
function tokenMatch(u,k){return u.includes(k)||(k.length>=4&&similarity(u,k)>=.78)}
function assess(user,candidates){return CivilGrader.match(user,CivilGrader.makeOption(candidates))}

function initialOf(text){
  const m=(text||'').match(/[가-힣A-Za-z0-9]/);
  return m?m[0].toUpperCase():''
}

function memoryClean(text){
  let s=String(text||'')
    .normalize('NFKC')
    .replace(/\([^)]*\)/g,' ')
    .replace(/[·•]/g,' ')
    .replace(/\s+/g,' ')
    .trim();

  MEMORY_REPLACEMENTS.forEach(([a,b])=>{s=s.replace(a,b)});
  MEMORY_DROP_WORDS.forEach(w=>{
    s=s.replace(new RegExp(`(^|\\s)${w}(?=\\s|$)`,'g'),' ')
  });

  s=s
    .replace(/^(다음과 같다|다음 사항|다음 내용)\s*/,'')
    .replace(/\s*(한다|한다\.|할 것|하여야 한다|해야 한다)$/,'')
    .replace(/\s+/g,' ')
    .trim();

  if(s.length>22){
    const ks=keywords(s).slice(0,3);
    if(ks.length)s=ks.join(' ');
  }
  return s||String(text||'').trim();
}

function memoryCore(text){
  const s=memoryClean(text);
  const actionMap=[
    ['방지','막기'],['감소','줄이기'],['저하','낮추기'],['증가','높이기'],
    ['확보','챙기기'],['측정','재기'],['확인','보기'],['검토','살피기'],
    ['제거','빼기'],['배수','물빼기'],['보강','단단히'],['보호','지키기'],
    ['고정','묶기'],['차단','막기'],['연결','잇기'],['환기','바람넣기'],
    ['경고','알리기'],['대피','피하기'],['정리','치우기']
  ];
  for(const [key,word] of actionMap){
    if(s.includes(key)){
      const subject=s.replace(key,'').replace(/\s+/g,' ').trim();
      return (subject?subject+' ':'')+word;
    }
  }
  return s;
}

function makeScene(cores){
  if(!cores.length)return '';
  if(cores.length===1)return `${cores[0]}를 한 장면으로 기억`;
  if(cores.length===2)return `${cores[0]}고, ${cores[1]}`;
  if(cores.length===3)return `${cores[0]}, ${cores[1]}, 마지막으로 ${cores[2]}`;
  const head=cores.slice(0,-1).join(' → ');
  return `${head} → 끝에 ${cores[cores.length-1]}`;
}

function mnemonicToken(text){
  const core=memoryCore(text||'').trim();
  if(!core)return '';

  /* 영문 약어·기호로 시작하면 영문 첫 글자를 우선한다.
     예: CBR → C, K값 → K, Cone값 → C, N치 → N */
  const leadingEnglish=core.match(/^\s*([A-Za-z])/);
  if(leadingEnglish)return leadingEnglish[1].toUpperCase();

  const leadingKorean=core.match(/^\s*([가-힣])/);
  if(leadingKorean)return leadingKorean[1];

  const anyEnglish=core.match(/[A-Za-z]/);
  if(anyEnglish)return anyEnglish[0].toUpperCase();
  const anyKorean=core.match(/[가-힣]/);
  return anyKorean?anyKorean[0]:core.slice(0,1);
}

function mnemonicWord(token, fallback){
  return MNEMONIC_WORDS[token]||memoryCore(fallback||token).replace(/\s+/g,' ').trim();
}

function hasBatchim(word){
  const ch=(word||'').trim().slice(-1);
  if(!ch)return false;
  const code=ch.charCodeAt(0)-0xAC00;
  return code>=0&&code<=11171&&(code%28)!==0;
}
function particle(word,withBatchim,withoutBatchim){return hasBatchim(word)?withBatchim:withoutBatchim}
function subject(word){return word+particle(word,'이','가')}
function object(word){return word+particle(word,'을','를')}
function withWord(word){return word+particle(word,'과','와')}

function buildMnemonicSentence(items){
  const w=items.map(x=>x.word).filter(Boolean);
  const n=w.length;
  if(n===2)return `${subject(w[0])} ${object(w[1])} 챙긴다`;
  if(n===3)return `${subject(w[0])} ${object(w[1])} 들고 ${w[2]}로 간다`;
  if(n===4)return `${subject(w[0])} ${object(w[1])} 들고 ${withWord(w[2])} 함께 ${w[3]}로 간다`;
  if(n===5)return `${subject(w[0])} ${w[1]}, ${w[2]}, ${object(w[3])} 챙겨 ${w[4]}로 간다`;
  return `${w.slice(0,-1).join(', ')}를 차례로 챙겨 마지막에 ${w[n-1]}로 간다`;
}

function practicalTipKeyword(text){
  let s=memoryClean(text||'').replace(/\s+/g,' ').trim();
  if(!s)s=String(text||'').replace(/\s+/g,' ').trim();
  if(s.length>26){
    const ks=keywords(s).slice(0,4);
    if(ks.length)s=ks.join(' · ');
  }
  return s;
}

function practicalTopic(q){
  const ks=keywords(q.question||'').slice(0,2);
  return ks.length?ks.join('·'):`${q.number||''}번`;
}

function practicalIntent(q){
  const text=q.question||'';
  if(/단점|문제점|원인|발생원인|파괴형태|결함|고장/.test(text))return '문제가 생긴 원인을 찾듯';
  if(/목적|역할|효과|장점|이유/.test(text))return '왜 필요한지 따져 보듯';
  if(/순서|절차|과정|단계/.test(text))return '요리 순서를 따라가듯';
  if(/조건|고려|선정|요구되는|기준/.test(text))return '시작 전 체크리스트를 보듯';
  if(/종류|분류|형식|방식|공법/.test(text))return '서랍을 종류별로 나누듯';
  return '해야 할 일을 하나씩 확인하듯';
}

function mnemonicAnswerSet(q){
  const groups=Array.isArray(q.allAnswers)?q.allAnswers:[];
  if(Array.isArray(q.mnemonicOrder)&&q.mnemonicOrder.length){
    return q.mnemonicOrder.map(n=>groups[Number(n)-1]).map(g=>Array.isArray(g)?g[0]:'').filter(Boolean);
  }
  if(q.mode==='grouped')return groups.map(g=>Array.isArray(g)?g[0]:'').filter(Boolean);
  const required=Math.max(1,Number(q.required)||((q.inputLabels||[]).length)||1);
  return groups.slice(0,required).map(g=>Array.isArray(g)?g[0]:'').filter(Boolean);
}

function easyMnemonicWord(token){
  if(EASY_MNEMONIC_WORDS[token])return EASY_MNEMONIC_WORDS[token];
  if(MNEMONIC_WORDS[token])return MNEMONIC_WORDS[token];
  if(/^[A-Z]$/.test(token))return MNEMONIC_WORDS[token]||`${token}로봇`;
  if(/^[가-힣]+$/.test(token))return `${token}돌이`;
  return `${token}카드`;
}

function easyMnemonicScene(words){
  if(!words.length)return '';
  if(words.length===1)return `${subject(words[0])} 크게 손을 흔들어요.`;
  const last=words[words.length-1];
  return `${words.join(', ')}${particle(last,'이','가')} 한 줄 기차를 타요.`;
}

function mnemonicFor(q){
  const answers=mnemonicAnswerSet(q);
  if(!answers.length)return null;

  const tokens=answers.map(initialOf).filter(Boolean);
  const words=tokens.map(easyMnemonicWord);
  const links=answers.map((answer,i)=>`${tokens[i]||'?'} = ${answer}`).join('<br>');

  return{
    code:`두문법 · ${tokens.join('·')}`,
    scene:easyMnemonicScene(words),
    note:`두문 풀기<br>${links}`
  };
}

function isStructuredTaltal(q){return q?.chapter==='탈탈'&&Array.isArray(q.studySections)&&q.studySections.length>0}
function safeStudyFragment(html){
  const template=document.createElement('template');template.innerHTML=String(html||'');
  const allowed=new Set(['P','BR','DIV','SPAN','STRONG','B','EM','I','TABLE','THEAD','TBODY','TFOOT','TR','TH','TD','UL','OL','LI','SUP','SUB','FIGURE','FIGCAPTION']);
  const clean=node=>{
    if(node.nodeType===Node.TEXT_NODE)return document.createTextNode(node.textContent||'');
    if(node.nodeType!==Node.ELEMENT_NODE)return document.createDocumentFragment();
    // Remove executable/foreign content altogether; unwrap other unsupported tags.
    if(['SCRIPT','STYLE','IFRAME','OBJECT','EMBED','SVG','MATH','LINK','META'].includes(node.tagName))return document.createDocumentFragment();
    const target=allowed.has(node.tagName)?document.createElement(node.tagName.toLowerCase()):document.createDocumentFragment();
    if(target.nodeType===Node.ELEMENT_NODE){
      for(const name of ['colspan','rowspan']){const value=node.getAttribute(name);if(value&&/^\d{1,2}$/.test(value)&&Number(value)>0)target.setAttribute(name,value)}
      const scope=node.getAttribute('scope');if(['col','row','colgroup','rowgroup'].includes(scope))target.setAttribute('scope',scope);
    }
    for(const child of node.childNodes)target.append(clean(child));return target;
  };
  const fragment=document.createDocumentFragment();for(const node of template.content.childNodes)fragment.append(clean(node));return fragment;
}

function studyPresentationContext(q,fieldIndex){

function studyLeadingMarker(value){

  return /^[가나다라마바사아자차카타파하A-Za-z]$/.test(marker)?marker+'.':marker;

function studySectionDisplayPrompt(context,mode){

// Manual navigation: preserve the active order, skip completed items, and wrap.
// The size of the unmastered list is never hard-coded.
function studyNavigationPlan(previousOrder,currentIndex,eligible,delta){
  const allowed=new Set(eligible);
  if(!allowed.size)return null;
  const ring=[...new Set([...previousOrder,...eligible])].filter(i=>BANK[i]);
  const direction=delta<0?-1:1;
  const at=ring.indexOf(currentIndex);
  const ordered=ring.filter(i=>allowed.has(i));
  if(at<0)return{view:ordered,index:direction>0?ordered[0]:ordered[ordered.length-1]};
  for(let step=1;step<=ring.length;step++){
    const candidate=ring[((at+direction*step)%ring.length+ring.length)%ring.length];
    if(allowed.has(candidate))return{view:ordered,index:candidate};
  }
  return null;
}

    const previousOrder=[...view],currentIndex=view[pos];

    if(!plan){showNeedsStudyComplete();return;}
    view=plan.view;pos=view.indexOf(plan.index);
    render();

  }

  const oldId=oldQ.id;
  clearCurrentUnlessMastered();
  if(!syncViewToActiveFilter())return;
  const sameCurrent=current()?.id===oldId;

<script id="flashcard-mode-addon-script">
(()=>{
  state.flashMode=!!state.flashMode;
  state.flashStats||={};
  const flashToggle=document.createElement('button');
  flashToggle.id='flashToggle';flashToggle.className='study-tool';flashToggle.type='button';flashToggle.textContent='앱카드';
  document.querySelector('#manageToggle').insertAdjacentElement('beforebegin',flashToggle);

  const panel=document.createElement('section');panel.id='flashcardPanel';panel.className='flashcard-panel';
  panel.innerHTML=`<div id="flashCard" class="flash-card" role="button" tabindex="0" aria-label="카드를 눌러 문제와 정답 전환">
    <div id="flashQuestion" class="flash-question"></div>
    <div id="flashAnswer" class="flash-answer"><div id="flashAnswerText"></div><div id="flashTip" class="flash-tip"></div></div>
  </div>
  <div class="flash-nav" aria-label="앱카드 문제 이동"><button id="flashPrev" type="button">이전</button><button id="flashNext" type="button">다음</button></div>
  <div class="flash-ratings" aria-label="암기 상태"><button data-rate="unmastered">암기 못함</button><button data-rate="mastered">암기 완료</button></div>
  <div id="flashDue" class="flash-due"></div>`;
  document.querySelector('.inline-actions').insertAdjacentElement('afterend',panel);

  function answerText(q){return (q.allAnswers||[]).map((g,i)=>`${i+1}. ${(g||[]).join(' / ')}`).join('\n');}
  function flashTipData(q){
    return mnemonicFor(q);
  }
  function renderFlashTip(q){
    const tip=document.querySelector('#flashTip'),memo=flashTipData(q);
    if(!memo){tip.innerHTML='';tip.style.display='none';return}
    tip.style.display='';
    tip.innerHTML=`<div class="flash-tip-title">암기 팁</div><div class="flash-tip-code">${memo.code}</div>${memo.scene?`<div class="flash-tip-scene">“${memo.scene}”</div>`:''}<div class="flash-tip-note">${memo.note}</div>`;
  }
  function questionText(q){
    if(q.hideGroupedChoices||q.mode!=='grouped'||!Array.isArray(q.inputLabels)||!q.inputLabels.length)return q.question;
    const choices=q.inputLabels.map((label,i)=>`${i+1}. ${label}`).join('\n');
    return `${q.question}\n\n${choices}`;
  }
  function renderFlash(){
    document.body.classList.toggle('flashcard-mode',state.flashMode);
    flashToggle.classList.toggle('active',state.flashMode);
    flashToggle.textContent=state.flashMode?'문제풀이':'앱카드';
    if(!state.flashMode)return;
    const q=current();if(!q)return;const k=qkey(q),card=document.querySelector('#flashCard');
    setFlashSide('question');
    if(isStructuredTaltal(q)){
      const question=document.querySelector('#flashQuestion');renderStudyQuestion(question,q);
      const spec=CivilGrader.schema(q);for(const section of spec.sections)appendStudySectionPrompt(question,q,section.indexes[0],'flash');
      const answer=document.querySelector('#flashAnswerText');answer.replaceChildren();
      CivilGrader.officialRows(q).forEach(item=>{const row=document.createElement('div');row.className='official-group';const label=document.createElement('strong');label.textContent=item.label+' ';const text=document.createElement('span');text.textContent=item.text;row.append(label,text);answer.append(row)});
      appendStudySolutionExtras(answer,q);
    }else{
      document.querySelector('#flashQuestion').classList.remove('taltal-structured-question');
      document.querySelector('#flashQuestion').textContent=questionText(q);
      document.querySelector('#flashAnswerText').textContent=answerText(q);
    }
    renderFlashTip(q);
    const due=state.review[k]?.due;
    document.querySelector('#flashDue').textContent=due?`다음 복습 예정: ${due}`:'아직 복습 일정 없음';
  }

  function setFlashSide(side){
    const card=document.querySelector('#flashCard');
    const showAnswer=side==='answer';
    card.classList.toggle('flipped',showAnswer);
  }
  function flip(){setFlashSide(document.querySelector('#flashCard').classList.contains('flipped')?'question':'answer')}
  function rate(kind){
    const autoOrigin=window.CivilFlashRepeat?.captureFlash();
    const k=qkey(current());
    if(kind==='mastered'){
      state.status[k]='mastered';
      scheduleReview(k,'mastered');
      // 앱카드의 자기평가는 화면상 완료로 표시하되, 실제 암기 검증은 타이핑으로 한 번 더 한다.
      state.memoryVerify[k]={pending:true,due:localDateKey(),source:'flashcard',reason:'typing',marked:localDateKey()};
    }else{
      state.status[k]='unmastered';
      scheduleReview(k,'unmastered');
      delete state.memoryVerify[k];
    }
    const fs=state.flashStats[k]||{count:0};
    fs.count++;
    fs.last=localDateKey();
    fs.rating=kind;
    state.flashStats[k]=fs;
    save();
    if(window.CivilFlashRepeat?.afterFlashRating(autoOrigin))return;
    const activeMode=$('#mode')?.value||state.mode||'all';
    if(['mastered','needsStudy'].includes(activeMode)){
      const oldBankIndex=view[pos];
      const fresh=filteredIndices(activeMode,norm($('#search')?.value||''));
      if(!fresh.length){
        view=[];
        $('#mode').value='all';
        state.mode='all';
        view=filteredIndices('all',norm($('#search')?.value||''));
        pos=Math.min(oldBankIndex??0,Math.max(0,view.length-1));
        save();render();
        alert('현재 상태의 앱카드 학습을 모두 마쳤습니다.');
        return;
      }
      view=fresh;
      let nextPos=view.findIndex(i=>i>oldBankIndex);
      if(nextPos<0)nextPos=0;
      pos=nextPos;
      save();render();
      return;
    }
    if(pos<view.length-1){pos++;render()}else{render();alert('현재 앱카드 학습을 모두 마쳤습니다.')}
  }
  const originalRender=render;
  render=function(){originalRender();renderFlash()};
  flashToggle.onclick=()=>{state.flashMode=!state.flashMode;save();render()};
  function goFlashPrev(){if(!syncViewToActiveFilter()||!view.length)return;pos=(pos-1+view.length)%view.length;render()}
  function goFlashNext(){if(!syncViewToActiveFilter()||!view.length)return;pos=(pos+1)%view.length;render()}
  document.querySelector('#flashPrev').onclick=goFlashPrev;
  document.querySelector('#flashNext').onclick=goFlashNext;

  const flashCard=document.querySelector('#flashCard');
  let swipeStartX=0,swipeStartY=0,swipePointer=null,swipeMoved=false,ignoreCardClick=false;
  flashCard.addEventListener('pointerdown',e=>{
    if(e.pointerType==='mouse'&&e.button!==0)return;
    swipePointer=e.pointerId;swipeStartX=e.clientX;swipeStartY=e.clientY;swipeMoved=false;
    try{flashCard.setPointerCapture(e.pointerId)}catch(_){ }
  });
  flashCard.addEventListener('pointermove',e=>{
    if(e.pointerId!==swipePointer)return;
    const dx=e.clientX-swipeStartX,dy=e.clientY-swipeStartY;
    if(Math.abs(dx)>12&&Math.abs(dx)>Math.abs(dy))swipeMoved=true;
  });
  flashCard.addEventListener('pointerup',e=>{
    if(e.pointerId!==swipePointer)return;
    const dx=e.clientX-swipeStartX,dy=e.clientY-swipeStartY;
    swipePointer=null;
    if(dx<-55&&Math.abs(dx)>Math.abs(dy)*1.2){
      ignoreCardClick=true;
      goFlashNext();
      setTimeout(()=>{ignoreCardClick=false},0);
    }
  });
  flashCard.addEventListener('pointercancel',()=>{swipePointer=null;swipeMoved=false});
  flashCard.onclick=()=>{
    if(ignoreCardClick||swipeMoved){swipeMoved=false;return}
    flip();
  };
  flashCard.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}};
  panel.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>rate(b.dataset.rate));
  render();
})();
</script>

<script id="daily30-study-script">
(()=>{
  'use strict';
  // Legacy fast-30 sessions are retired. Their learning records remain untouched.
  state.fast30Mode=false;state.fast30Session=null;state.fast30Processed=null;
  state.daily30Mode=!!state.daily30Mode;
  state.daily30Session=(state.daily30Session&&typeof state.daily30Session==='object')?state.daily30Session:null;
  let session=state.daily30Session;

  const toggle=document.createElement('button');
  toggle.id='daily30Toggle';toggle.type='button';toggle.textContent='오늘 30문제';
  document.querySelector('#manageToggle').insertAdjacentElement('beforebegin',toggle);
  const panel=document.createElement('section');
  panel.id='daily30Panel';panel.className='daily30-panel';
  panel.innerHTML=`
    <div class="daily30-head"><span class="daily30-title">오늘의 암기 · 30문제</span><span id="daily30Date" class="daily30-date"></span></div>
    <div class="daily30-rule">오늘 배정된 문제는 <b>암기 완료</b>가 될 때까지 계속 반복됩니다. 오늘 못 외운 문제는 다음 학습일에 먼저 이월되고, 빈 자리만 새 문제로 채워 다시 최대 30문제가 배정됩니다.</div>
    <div class="daily30-stats">
      <div class="daily30-stat">오늘 할당<strong id="daily30Assigned">0</strong></div>
      <div class="daily30-stat">이월<strong id="daily30Carry">0</strong></div>
      <div class="daily30-stat">암기 완료<strong id="daily30Done">0</strong></div>
      <div class="daily30-stat">남은 문제<strong id="daily30Remain">0</strong></div>
    </div>
    <div id="daily30Message" class="daily30-message"></div>`;
  document.querySelector('#question').insertAdjacentElement('beforebegin',panel);

  function validIndex(i){return isActiveQuestionIndex(i)}
  function keyAt(i){return validIndex(i)?qkey(BANK[i]):''}
  function isNeed(i){const k=keyAt(i);return !!k&&state.status[k]!=='mastered'}
  function today(){return localDateKey()}
  function activeAssigned(){return session?session.assigned.filter(isNeed):[]}
  function normalizeSession(){
    if(!session||!Array.isArray(session.assigned))return false;
    session.assigned=[...new Set(session.assigned.filter(validIndex))].slice(0,30);
    session.carryCount=Math.max(0,Math.min(Number(session.carryCount)||0,session.assigned.length));
    return typeof session.date==='string'&&!!session.date;
  }
  function makeTodaySession(){
    const previous=normalizeSession()?session:null;
    const carry=previous?previous.assigned.filter(isNeed):[];
    const chosen=[...carry];const used=new Set(chosen);
    for(let i=0;i<BANK.length&&chosen.length<30;i++){
      if(!used.has(i)&&isNeed(i)){chosen.push(i);used.add(i)}
    }
    session={date:today(),assigned:chosen,carryCount:carry.length,cursor:0,
      returnMode:$('#mode')?.value||state.mode||'all',returnSearch:$('#search')?.value||'',
      returnYearFilter:activeYear(),returnId:current()?.id??null};
    state.daily30Session=session;state.daily30Mode=!!state.daily30Mode;save();
  }
  function ensureToday(){
    if(state.daily30Session&&state.daily30Session!==session)session=state.daily30Session;
    if(!normalizeSession()||session.date!==today())makeTodaySession();
    return session;
  }
  function updatePanel(){
    ensureToday();const active=activeAssigned(),done=session.assigned.length-active.length;
    $('#daily30Date').textContent=session.date;
    $('#daily30Assigned').textContent=session.assigned.length;
    $('#daily30Carry').textContent=session.carryCount||0;
    $('#daily30Done').textContent=done;
    $('#daily30Remain').textContent=active.length;
    $('#daily30Message').textContent=active.length
      ?`남은 ${active.length}문제가 반복됩니다. 암기 완료를 누르면 오늘 반복 목록에서 빠집니다.`
      :(session.assigned.length?'오늘 배정된 문제를 모두 암기 완료했습니다.':'암기 못함 문제가 없습니다.');
  }
  function setToggle(){toggle.classList.toggle('active',!!state.daily30Mode);toggle.textContent=state.daily30Mode?'오늘 30 종료':'오늘 30문제'}
  function rememberReturn(){
    if(session&&state.daily30Mode)return;
    ensureToday();
    session.returnMode=$('#mode')?.value||state.mode||'all';session.returnSearch=$('#search')?.value||'';
    session.returnYearFilter=activeYear();session.returnId=current()?.id??null;
  }
  function enterDaily(){
    ensureToday();rememberReturn();const active=activeAssigned();
    state.daily30Mode=true;state.flashMode=false;
    view=[...active];
    if(view.length){const cur=Math.max(0,Math.min(Number(session.cursor)||0,view.length-1));pos=cur}else pos=0;
    save();render();
  }
  function restoreNormal(){
    state.daily30Mode=false;
    state.yearFilter=validYearFilter(session?.returnYearFilter||state.yearFilter||'all');
    const allowed=['all','taltal','review','wrong','frequentWrong','recentWrong','unanswered','favorite','mastered','needsStudy'];
    const mode=allowed.includes(session?.returnMode)?session.returnMode:'all',search=typeof session?.returnSearch==='string'?session.returnSearch:'';
    if($('#mode'))$('#mode').value=mode;if($('#search'))$('#search').value=search;state.mode=mode;state.search=search;
    let fresh=filteredIndices(mode,norm(search));if(!fresh.length){fresh=filteredIndices('all','');if($('#mode'))$('#mode').value='all';if($('#search'))$('#search').value='';state.mode='all';state.search=''}
    view=[...fresh];const wanted=session?.returnId;const at=wanted!=null?view.findIndex(i=>BANK[i]?.id===wanted):-1;pos=at>=0?at:0;
    save();render();
  }
  function syncDailyAfterChange(direction=1){
    if(!state.daily30Mode)return false;
    ensureToday();const previousOrder=[...view],oldIndex=view[pos],active=activeAssigned();
    const plan=studyNavigationPlan(previousOrder,oldIndex,active,direction);
    view=[...active];
    pos=plan?Math.max(0,view.indexOf(plan.index)):0;
    session.cursor=pos;save();render();return true;
  }
  function moveDaily(delta){
    if(!state.daily30Mode)return false;
    ensureToday();const previousOrder=[...view],oldIndex=view[pos],active=activeAssigned();
    const plan=studyNavigationPlan(previousOrder,oldIndex,active,delta);
    view=[...active];pos=plan?Math.max(0,view.indexOf(plan.index)):0;
    session.cursor=pos;save();render();return true;
  }

  const previousRender=render;
  render=function(){
    if(state.daily30Mode){
      ensureToday();const active=activeAssigned();view=[...active];
      if(view.length)pos=Math.max(0,Math.min(pos,view.length-1));else pos=0;
    }
    previousRender();document.body.classList.toggle('daily30-mode',!!state.daily30Mode);setToggle();updatePanel();
    if(state.daily30Mode&&session){session.cursor=pos;state.daily30Session=session;save()}
  };

  toggle.onclick=()=>state.daily30Mode?restoreNormal():enterDaily();
  $('#next').addEventListener('click',e=>{if(state.daily30Mode){e.preventDefault();e.stopImmediatePropagation();moveDaily(1)}},true);
  $('#prev').addEventListener('click',e=>{if(state.daily30Mode){e.preventDefault();e.stopImmediatePropagation();moveDaily(-1)}},true);
  $('#markMastered').addEventListener('click',()=>{if(state.daily30Mode)setTimeout(()=>syncDailyAfterChange(1),0)});
  $('#markUnmastered').addEventListener('click',()=>{if(state.daily30Mode){ensureToday();updatePanel();save()}});
  $('#resetConfirmYes')?.addEventListener('click',()=>{state.daily30Mode=false;state.daily30Session=null;session=null;document.body.classList.remove('daily30-mode');setToggle()});
  window.addEventListener('focus',()=>{if(!window.CivilRandomQuiz?.isOpen?.()&&state.daily30Mode&&session?.date!==today()){ensureToday();view=activeAssigned();pos=0;render()}});
  window.CivilDaily30={active:()=>!!state.daily30Mode,session:()=>{ensureToday();return session},refreshPanel:updatePanel,refresh:()=>{ensureToday();if(!window.CivilRandomQuiz?.isOpen?.())render()}};
  ensureToday();if(state.daily30Mode)enterDaily();else{setToggle();updatePanel();save()}
})();
</script>

<script id="ctrl-enter-grade-next">
(()=>{
  'use strict';
  // Ctrl+Enter: grade once, then use the existing Next action.
  // This transient snapshot never changes saved answers or grading rules.
  const check=document.querySelector('#check');
  const next=document.querySelector('#next');
  const answers=document.querySelector('#answers');
  if(!check||!next||!answers)return;
  let lastGrade=null;
  function typingMode(){return !window.CivilRandomQuiz?.isOpen?.()&&!state.fast30Mode&&!state.flashMode&&!examActive}
  function snapshot(){
    const q=current();
    const inputs=[...answers.querySelectorAll('.answer-input')];
    if(!q||!inputs.length)return null;
    return {key:qkey(q),context:JSON.stringify([$('#mode')?.value,activeYear(),$('#search')?.value]),inputs,values:inputs.map(el=>el.value)};
  }
  function unchanged(s){
    return !!(s&&lastGrade&&s.key===lastGrade.key&&s.context===lastGrade.context&&
      s.inputs.length===lastGrade.inputs.length&&
      s.inputs.every((el,i)=>el===lastGrade.inputs[i]&&el.value===lastGrade.values[i])&&
      $('#result')?.classList.contains('show')&&$('#result .result-summary'));
  }
  check.addEventListener('click',()=>{
    if(!typingMode())return;
    lastGrade=$('#result')?.classList.contains('show')&&$('#result .result-summary')?snapshot():null;
  });
  // Any edit requires a fresh grade, even when Undo restores the old text.
  answers.addEventListener('input',e=>{
    if(e.target.matches?.('.answer-input'))lastGrade=null;
  });
  // Window capture handles only this shortcut before the old Enter handlers.
  // Tab, Shift+Tab, plain Enter and all other modes keep their existing behavior.
  window.addEventListener('keydown',e=>{
    if(!typingMode()||e.key!=='Enter'||!(e.ctrlKey||e.metaKey)||e.shiftKey||e.altKey)return;
    const target=e.target;
    if(target?.isContentEditable||
      (target?.matches?.('input,select,textarea')&&!target.matches('.answer-input')))return;
    if($('#resetConfirmModal')?.classList.contains('show')){
      e.preventDefault();e.stopImmediatePropagation();return;
    }
    const inStudy=target===document.body||target===document.documentElement||
      target?.closest?.('main.card');
    if(!inStudy)return;
    // Do not grade a partially composed Korean character.
    if(e.isComposing||e.keyCode===229){e.stopImmediatePropagation();return}
    e.preventDefault();e.stopImmediatePropagation();
    // Holding Enter must not grade and skip several questions in one press.
    if(e.repeat)return;
    const s=snapshot();
    if(!s)return;
    if(unchanged(s)){
      if(next.disabled)return;
      const previousFirst=s.inputs[0];
      next.click();
      const first=answers.querySelector('.answer-input');
      // A boundary/completion message is not a new question.
      if(first&&first!==previousFirst&&first.getClientRects().length){
        lastGrade=null;
        first.focus();
        first.setSelectionRange(first.value.length,first.value.length);
      }
    }else if(!check.disabled){
      check.click();
    }
  },true);
})();
</script>

<script id="manual-study-navigation">
(()=>{
  'use strict';
  function mode(){return $('#mode')?.value||state.mode||'all'}
  function context(){return `${mode()}|${activeYear()}|${$('#search')?.value||''}`}
  function captureFlash(){
    if(!state.flashMode||!['all','needsStudy','wrong','favorite'].includes(mode()))return null;
    const eligible=filteredIndices(mode(),norm($('#search')?.value||''));
    const allowed=new Set(eligible);
    const indices=[...new Set([...view,...eligible])].filter(i=>allowed.has(i));
    if(!indices.some(i=>state.status[qkey(BANK[i])]!=='mastered'))return null;
    return{signature:context(),index:view[pos],indices};
  }
  function afterFlashRating(origin){
    if(!origin||!state.flashMode||context()!==origin.signature)return false;
    const remaining=origin.indices.filter(i=>state.status[qkey(BANK[i])]!=='mastered');
    const plan=studyNavigationPlan(origin.indices,origin.index,remaining,1);
    if(!plan){render();$('#flashDue').textContent='이 범위의 문제를 모두 암기 완료했습니다.';save();return true;}
    view=mode()==='all'?origin.indices.slice():plan.view;
    pos=view.indexOf(plan.index);save();render();return true;
  }
  window.CivilFlashRepeat={captureFlash,afterFlashRating};
  // No timer, no countdown, and no interception of the Next button.
  // Enter moves between fields or grades; Shift+Enter inserts a newline.
  document.addEventListener('keydown',e=>{
    if(state.fast30Mode||state.flashMode||examActive||e.key!=='Enter'||e.shiftKey||e.isComposing||e.keyCode===229||!e.target.matches?.('.answer-input'))return;
    e.preventDefault();e.stopImmediatePropagation();
    const inputs=[...document.querySelectorAll('.answer-input')],i=inputs.indexOf(e.target);
    if(!e.ctrlKey&&!e.metaKey&&i>=0&&i<inputs.length-1)inputs[i+1].focus();
    else $('#check').click();
  },true);
})();
</script>

#syncBridgeBadge{display:inline-flex;align-items:center;justify-content:center;min-height:28px;padding:3px 7px;border:1px solid #aaa;border-radius:999px;background:#f3f3f3;color:#555!important;font-size:10px;font-weight:900;white-space:nowrap}

<script id="quietmemo-sync-bridge-script">
(()=>{
  const BASE='http://127.0.0.1:17361/v1';
  state.memoryUpdated||={};if(!Number.isFinite(state.daily30Updated))state.daily30Updated=0;
  let connected=false,lastDailyDigest='',lastSentMemory={};
  const badge=document.createElement('span');badge.id='syncBridgeBadge';badge.textContent='연동 대기';
  document.querySelector('.meta-tools')?.prepend(badge);
  function setConnected(on){connected=!!on;badge.classList.toggle('on',connected);badge.textContent=connected?'스티커 연동됨':'스티커 미연동'}
  async function api(path,opt={}){
    const c=new AbortController(),tm=setTimeout(()=>c.abort(),900);
    try{const r=await fetch(BASE+path,{cache:'no-store',...opt,signal:c.signal});if(!r.ok)throw new Error(String(r.status));setConnected(true);return await r.json()}catch(e){setConnected(false);throw e}finally{clearTimeout(tm)}
  }
  function webDaily(){
    const s=state.daily30Session;
    if(!s||!Array.isArray(s.assigned)||!s.date)return {date:'',assigned:[],carryCount:0,updated:0};
    return {date:s.date,assigned:[...new Set(s.assigned.filter(isActiveQuestionIndex).map(i=>BANK[i].id))].slice(0,30),carryCount:Math.max(0,Math.min(Number(s.carryCount)||0,30)),updated:Number(state.daily30Updated)||0};
  }
  function snapshot(){
    const memorized={},unmemorized={};
    for(const q of BANK){if(q.removedDuplicate)continue;const k=qkey(q);if(state.status[k]==='mastered')memorized[k]=true;else if(state.status[k]==='unmastered')unmemorized[k]=true}
    return {version:1,memorized,unmemorized,memoryUpdated:{...state.memoryUpdated},daily30:webDaily()};
  }
  function applyMemory(remote){
    let changed=false;
    const rm=remote?.memorized||{},ru=remote?.unmemorized||{},rt=remote?.memoryUpdated||{};
    for(const q of BANK){
      if(q.removedDuplicate)continue;
      const k=qkey(q),incoming=rm[k]?'mastered':(ru[k]?'unmastered':null);if(!incoming)continue;
      const iu=Number(rt[k])||0,lu=Number(state.memoryUpdated[k])||0,local=state.status[k];
      if(iu<lu)continue;
      if(iu===lu&&iu>0)continue;
      if(iu===0&&lu===0&&local==='mastered'&&incoming!=='mastered')continue;
      if(local!==incoming){state.status[k]=incoming;changed=true;if(incoming==='unmastered'){delete state.memoryVerify?.[k];delete state.answers?.[k];delete state.corrections?.[k];delete state.attempts?.[k]}}
      state.memoryUpdated[k]=iu||Date.now();
    }
    return changed;
  }
  function applyDaily(d){
    if(!d||!d.date||!Array.isArray(d.assigned))return false;
    const local=state.daily30Session,lu=Number(state.daily30Updated)||0,iu=Number(d.updated)||0;
    if(local?.date&&d.date<local.date)return false;
    if(local?.date===d.date){if(iu<lu)return false;if(iu===lu&&iu>0)return false;if(iu===0&&lu===0&&Array.isArray(local.assigned)&&local.assigned.length)return false}
    const inds=[];const seen=new Set();for(const id of d.assigned){const i=BANK.findIndex(q=>q.id===id);if(isActiveQuestionIndex(i)&&!seen.has(i)){seen.add(i);inds.push(i);if(inds.length===30)break}}
    state.daily30Session={...(local||{}),date:d.date,assigned:inds,carryCount:Math.max(0,Math.min(Number(d.carryCount)||0,inds.length)),cursor:0};
    state.daily30Updated=iu||Date.now();
    if(window.CivilDaily30?.active?.())setTimeout(()=>window.CivilDaily30.refresh(),0);
    return true;
  }
  async function pull(){
    try{const remote=await api('/sync');const m=applyMemory(remote),d=applyDaily(remote.daily30);if(m||d){updateStatusCounts?.();updateQuickFilterButtons?.();const q=current?.();if(q)updateCurrentMemoryUI?.(qkey(q));save();if(window.CivilDaily30?.active?.())window.CivilDaily30.refresh()}}catch(e){}
  }
  async function initialMerge(){
    try{await api('/sync',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(snapshot())});setTimeout(pull,180)}catch(e){}
  }
  async function pushMemoryChanges(){
    if(!connected)return;
    for(const q of BANK){if(q.removedDuplicate)continue;const k=qkey(q),u=Number(state.memoryUpdated[k])||0;if(!u||lastSentMemory[k]===u)continue;const v=state.status[k];if(v!=='mastered'&&v!=='unmastered')continue;
      lastSentMemory[k]=u;try{await api('/memory',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:q.id,mastered:v==='mastered',updated:u})})}catch(e){delete lastSentMemory[k];break}
    }
  }
  async function pushDailyChange(){
    if(!connected)return;const d=webDaily(),digest=JSON.stringify([d.date,d.assigned,d.carryCount]);if(!d.date||digest===lastDailyDigest)return;
    lastDailyDigest=digest;if(!state.daily30Updated){state.daily30Updated=Date.now();d.updated=state.daily30Updated;save()}else d.updated=state.daily30Updated;
    try{await api('/daily30',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)})}catch(e){lastDailyDigest=''}
  }
  setInterval(()=>{pushMemoryChanges();pushDailyChange()},800);
  setInterval(pull,2200);
  window.addEventListener('focus',pull);
  initialMerge();
})();
</script>

<script id="quick-study-script">
(()=>{
  'use strict';
  const question=document.querySelector('#question');
  if(!question)return;
  const wrap=document.createElement('section');
  wrap.className='quick-study-wrap';wrap.setAttribute('aria-label','빠른 학습');
  wrap.innerHTML='<div id="quickStudyTools"><button id="quickAnswer" type="button" title="정답을 기존 답안칸에 채웁니다. 현재 문제에서 답을 확인하세요.">정답</button><button id="quickNext" type="button" title="현재 학습 순서의 다음 문제로 이동합니다.">다음</button></div><p class="quick-study-help">정답을 채워 확인하고, ‘다음’을 눌러 이동하세요. <kbd>Alt + Enter: 정답</kbd></p><div id="quickStudyNotice" role="status" aria-live="polite" hidden></div>';
  question.insertAdjacentElement('beforebegin',wrap);
  const answerButton=wrap.querySelector('#quickAnswer');
  const nextButton=wrap.querySelector('#quickNext');
  const notice=wrap.querySelector('#quickStudyNotice');

  // Read the compiled field schema: fixed labels, ordered steps and grouped
  // lists retain precisely the existing input layout. Display-only reference
  // rows and alternative spellings are not inserted as additional answers.
  function canonicalAnswers(q){
    const spec=CivilGrader.schema(q);
    const values=Array(spec.inputCount).fill('');
    const first=option=>String(option?.aliases?.[0]||option?.text||'');
    for(const section of spec.sections){
      const fields=section.indexes;
      if(section.kind==='fixed'){
        values[fields[0]]=first(section.options[0]);
      }else{
        const selected=section.options.slice(0,section.required).map(first);
        if(fields.length===1)values[fields[0]]=selected.join('\n');
        else fields.forEach((field,i)=>{values[field]=selected[i]||''});
      }
    }
    return values;
  }
  function validIndex(index){return isActiveQuestionIndex(index)}
  function recordChoice(index,known,source){
    if(!validIndex(index))return false;
    const q=BANK[index],key=qkey(q),now=Date.now();
    state.status[key]=known?'mastered':'unmastered';
    state.memoryUpdated||={};state.memoryUpdated[key]=now;
    state.memoryJudgments||={};
    state.memoryJudgments[key]={source:source||'quick-fill',kind:'self-check',known,updated:now};
    scheduleReview(key,state.status[key]);
    // An explicit self-check is allowed without a mandatory typing exercise.
    // Keep the original typed attempts and historical grading records intact.
    delete state.memoryVerify[key];
    if(known){state.answers[key]=canonicalAnswers(q);delete state.corrections[key]}
    save();
    return true;
  }
  function markKnown(index,source){return recordChoice(index,true,source)}
  function markRetry(index,source){return recordChoice(index,false,source)}
  function updateCounters(){
    updateStatusCounts();updateQuickFilterButtons();
    window.CivilDaily30?.refreshPanel?.();
    const q=current();if(q)updateCurrentMemoryUI(qkey(q));
    const reviewOption=$('#mode')?.querySelector('option[value="review"]');
    if(reviewOption)reviewOption.textContent=`오늘 복습 (${todayReviewCount()})`;
  }
  function say(message){notice.textContent=message;notice.hidden=false}
  function clearNotice(){notice.hidden=true;notice.textContent=''}
  function blocked(){return window.CivilRandomQuiz?.isOpen?.()||$('#resetConfirmModal')?.classList.contains('show')}
  function fillAnswer(){
    if(blocked())return;
    const q=current();if(!q)return;
    const key=qkey(q),values=canonicalAnswers(q);
    const inputs=[...document.querySelectorAll('#answers .answer-input')];
    if(inputs.length!==values.length){say('답안칸을 다시 표시한 뒤 진행해 주세요.');return}
    inputs.forEach((input,i)=>{input.value=values[i];input.classList.remove('auto-corrected');autoGrow(input)});
    // Viewing an answer is separate from a memory judgment. Preserve the
    // current question, typed attempts and existing memory status.
    state.answers[key]=[...values];delete state.corrections[key];
    $('#result').className='result';$('#result').innerHTML='';
    save();
    say(`${q.number}번 · 정답을 채웠습니다. 확인 후 ‘다음’을 눌러 주세요.`);
  }
  function nextQuestion(){
    if(blocked()||!current())return;
    const originalNext=$('#next');if(!originalNext||originalNext.disabled)return;
    const before=current().id;
    clearNotice();
    // Reuse the original event path, including the daily queue's capture
    // handler, so a single click advances exactly once in the active order.
    originalNext.click();
    if(current()?.id===before&&!state.daily30Mode&&($('#mode')?.value||state.mode)!=='needsStudy')say('마지막 문제입니다.');
  }
  answerButton.addEventListener('click',fillAnswer);
  nextButton.addEventListener('click',nextQuestion);
  window.CivilQuickStudy={canonicalAnswers,markKnown,markRetry,fillAnswer,nextQuestion,clearNotice,updateCounters};
  $('#resetConfirmYes')?.addEventListener('click',()=>{clearNotice();answerButton.disabled=nextButton.disabled=!current()});
  // Keep shortcut handling outside the older global Enter-to-grade handlers.
  window.addEventListener('keydown',event=>{
    if(window.CivilRandomQuiz?.isOpen?.())return;
    if(event.isComposing||event.keyCode===229)return;
    const target=event.target;
    if(event.key==='Enter'&&event.altKey&&!event.ctrlKey&&!event.metaKey&&!event.shiftKey&&target?.closest?.('main.card')){
      event.preventDefault();event.stopImmediatePropagation();
      if(!event.repeat)fillAnswer();
      return;
    }
    if(target?.closest?.('#quickStudyTools')&&(event.key==='Enter'||event.key===' ')&&!event.altKey&&!event.ctrlKey&&!event.metaKey){
      event.preventDefault();event.stopImmediatePropagation();
      if(!event.repeat)target.closest('button')?.click();
    }
  },true);
  answerButton.disabled=nextButton.disabled=!current();
})();
</script>

<script id="civil-random-quiz-script">
(()=>{
  'use strict';
  if(window.CivilRandomQuiz)return;
  const byId=id=>document.getElementById(id);
  const allowedScopes=new Set(['current','all','needsStudy']);
  const allowedSizes=new Set(['10','20','30','all']);
  const validIndex=i=>isActiveQuestionIndex(i);
  const validChoice=c=>['known','retry','skip'].includes(c);
  const cleanIndices=xs=>Array.isArray(xs)?[...new Set(xs.filter(validIndex))]:[];
  // Legacy content signatures are used only to identify old full-bank saved
  // sessions for repair. New quizzes use every active question ID.
  const legacySignatureCache=new Map();
  const signatureText=value=>String(value??'').normalize('NFKC').toLowerCase().replace(/\s+/g,'');
  function legacyQuestionSignature(index){
    if(legacySignatureCache.has(index))return legacySignatureCache.get(index);
    const q=BANK[index],spec=CivilGrader.schema(q);
    const sections=spec.sections.map(section=>{
      const options=section.options.map(option=>signatureText(option.aliases?.[0]||option.text));
      // A list can be answered in any order; ordered construction steps retain order.
      if(section.kind==='list')options.sort();
      return {kind:section.kind,title:signatureText(section.title),required:section.required,options};
    });
    const key=JSON.stringify([signatureText(q.question),sections]);legacySignatureCache.set(index,key);return key;
  }
  function restoreLegacyFullBank(s,raw){
    if(raw.version!==1||!s.queue.length||s.queue.length>=ACTIVE_QUESTION_COUNT)return;
    const label=String(raw.scopeLabel||'');
    const explicitFull=/^전체 범위 · 중복 제외 \d+문제$/.test(label);
    const currentFull=label==='현재 학습 범위 · 전체 연도'&&!state.daily30Mode&&
      (byId('mode')?.value||state.mode)==='all'&&activeYear()==='all'&&
      !String(byId('search')?.value||'').trim()&&cleanIndices(view).length===ACTIVE_QUESTION_COUNT;
    if(!explicitFull&&!currentFull)return;
    const allSignatures=new Set(ACTIVE_BANK_INDICES.map(legacyQuestionSignature));
    const oldSignatures=new Set(s.queue.map(legacyQuestionSignature));
    if(s.queue.length!==allSignatures.size||oldSignatures.size!==allSignatures.size||
      [...allSignatures].some(key=>!oldSignatures.has(key)))return;
    const used=new Set(s.queue),missing=shuffled(ACTIVE_BANK_INDICES.filter(index=>!used.has(index)));
    const wasComplete=s.cursor===s.queue.length;
    s.queue.push(...missing);s.restoredOriginals=missing.length;s.completedAt=0;
    if(wasComplete){s.revealed=false;if(s.screen!=='settings')s.screen='round'}
  }
  function inputValues(q,values){
    const count=CivilGrader.schema(q).inputCount;
    return Array.from({length:count},(_,i)=>typeof values?.[i]==='string'?values[i]:'');
  }
  function validGradeRecord(record,values,q){
    if(!record||record.version!==CivilGrader.gradingVersion(q)||!Array.isArray(record.values)||record.values.length!==values.length||record.values.some((value,i)=>value!==values[i]))return false;
    const data=record.data;
    return !!(data&&Number.isFinite(data.total)&&data.total>0&&['correctCount','partialCount','wrongCount','extraCount'].every(name=>Number.isFinite(data[name])&&data[name]>=0)&&typeof data.perfect==='boolean'&&Array.isArray(data.results)&&data.results.every(row=>row&&typeof row==='object'&&Number.isFinite(row.score)&&row.score>=0&&row.score<=1));
  }
  const fresh=()=>({version:3,open:false,screen:'settings',settings:{scope:'current',size:'20'},queue:[],cursor:0,revealed:false,results:[],answers:{},grades:{},scopeLabel:'',startedAt:0,completedAt:0,restoredOriginals:0});
  function normalize(raw){
    const base=fresh();
    if(!raw||typeof raw!=='object'||![1,2,3].includes(raw.version))return base;
    base.settings.scope=allowedScopes.has(raw.settings?.scope)?raw.settings.scope:'current';
    base.settings.size=allowedSizes.has(String(raw.settings?.size))?String(raw.settings.size):'20';
    base.open=raw.open===true;
    const queue=cleanIndices(raw.queue),cursor=raw.cursor;
    const results=Array.isArray(raw.results)?raw.results:[];
    const coherent=queue.length&&queue.length===raw.queue?.length&&Number.isInteger(cursor)&&cursor>=0&&cursor<=queue.length&&results.length===cursor&&results.every((r,i)=>r&&r.index===queue[i]&&validChoice(r.choice));
    if(coherent){
      base.queue=queue;base.cursor=cursor;base.results=results.map(r=>({index:r.index,choice:r.choice,at:Number(r.at)||0}));
      base.revealed=raw.revealed===true&&cursor<queue.length;
      base.scopeLabel=typeof raw.scopeLabel==='string'?raw.scopeLabel:'';
      base.startedAt=Number(raw.startedAt)||0;base.completedAt=Number(raw.completedAt)||0;
      base.screen=raw.screen==='settings'?'settings':cursor===queue.length?'summary':'round';
      base.restoredOriginals=raw.version>=2?Math.max(0,Math.min(Number(raw.restoredOriginals)||0,ACTIVE_QUESTION_COUNT)):0;
      restoreLegacyFullBank(base,raw);
      if(/^전체 범위 · 중복 제외 \d+문제$/.test(base.scopeLabel))base.scopeLabel=`전체 ${ACTIVE_QUESTION_COUNT}문제`;
      if(raw.version===3){
        for(const index of base.queue){
          const q=BANK[index],key=qkey(q);
          if(!Array.isArray(raw.answers?.[key]))continue;
          const values=inputValues(q,raw.answers[key]);base.answers[key]=values;
          const record=raw.grades?.[key];
          if(validGradeRecord(record,values,q))base.grades[key]={version:record.version,values:[...record.values],data:record.data,at:Number(record.at)||0};
        }
      }
    }
    return base;
  }
  state.randomQuiz=normalize(state.randomQuiz);
  const qs=()=>state.randomQuiz||(state.randomQuiz=fresh());
  let opened=false,previousFocus=null,inertRecords=[],busy=false,lastStorageError=false,composingField=null;
  const modal=document.createElement('div');
  modal.id='civilRandomQuiz';modal.hidden=true;
  modal.innerHTML='<section class="rq-dialog" role="dialog" aria-modal="true" aria-labelledby="rqTitle" aria-describedby="rqDialogDescription" tabindex="-1"><div class="rq-header"><div class="rq-heading"><div class="rq-eyebrow">토목기사 · 빠른 암기 확인</div><h2 class="rq-title" id="rqTitle">랜덤 퀴즈</h2></div><div class="rq-header-actions"><button type="button" id="rqSettingsButton">범위 설정</button><button type="button" id="rqCloseButton" aria-label="랜덤 퀴즈 닫기">닫기</button></div></div><div class="rq-scroll" id="rqScreen"></div></section>';
  document.body.append(modal);
  const dialog=modal.querySelector('.rq-dialog'),screen=byId('rqScreen');
  const launcher=document.createElement('button');
  launcher.type='button';launcher.id='randomQuizLaunch';launcher.textContent='랜덤 퀴즈';launcher.setAttribute('aria-haspopup','dialog');launcher.setAttribute('aria-controls',modal.id);
  let launchHost=byId('quickStudyTools');
  if(!launchHost){
    launchHost=document.createElement('div');launchHost.id='randomQuizStandaloneTools';
    launchHost.style.cssText='display:flex;justify-content:flex-end;gap:7px;margin:7px 0';
    const anchor=document.querySelector('.app header');
    if(anchor)anchor.after(launchHost);else document.querySelector('.app')?.prepend(launchHost);
    if(!launchHost.isConnected)document.body.insertBefore(launchHost,modal);
  }
  launchHost.append(launcher);
  function el(tag,className,text){const n=document.createElement(tag);if(className)n.className=className;if(text!=null)n.textContent=String(text);return n}
  function button(text,handler,className=''){const n=el('button',className,text);n.type='button';n.addEventListener('click',handler);return n}
  function persist(){
    try{save();lastStorageError=false}catch(e){lastStorageError=true}
    updateLauncher();
  }
  function updateLauncher(){
    const s=qs(),pending=s.queue.length&&s.cursor<s.queue.length;
    launcher.title=pending?`저장된 랜덤 퀴즈 이어풀기 · ${s.cursor+1}/${s.queue.length}`:'답안을 직접 입력해 채점하거나 정답을 확인하며 학습합니다.';
  }
  function message(text){
    let box=byId('rqMessage');
    if(!box){box=el('p','rq-message');box.id='rqMessage';box.setAttribute('role','status');screen.append(box)}
    box.textContent=text||'';
  }
  function describeScope(scope){
    if(scope==='all')return `전체 ${ACTIVE_QUESTION_COUNT}문제`;
    if(scope==='current'&&state.daily30Mode)return '오늘 30문제 · 남은 배정 문제';
    const yr=typeof yearName==='function'?yearName(activeYear()):'현재 연도';
    const search=String(byId('search')?.value||'').trim();
    return scope==='needsStudy'?`암기 못함 · ${yr}${search?' · 검색 적용':''}`:`현재 학습 범위 · ${yr}${search?' · 검색 적용':''}`;
  }
  function candidates(scope){
    if(scope==='all')return [...ACTIVE_BANK_INDICES];
    const term=norm(byId('search')?.value||'');
    if(scope==='needsStudy')return cleanIndices(filteredIndices('needsStudy',term));
    if(state.daily30Mode){
      const assigned=window.CivilDaily30?.session?.()?.assigned||state.daily30Session?.assigned||[];
      return cleanIndices(assigned).filter(index=>state.status[qkey(BANK[index])]!=='mastered');
    }
    const mode=byId('mode')?.value||state.mode||'all';
    const eligible=new Set(filteredIndices(mode,term));
    return cleanIndices(view).filter(index=>eligible.has(index));
  }
  function shuffled(input){const a=cleanIndices(input);for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
  function totals(){return qs().results.reduce((a,r)=>{a[r.choice]++;return a},{known:0,retry:0,skip:0})}
  function focusFirst(selector){requestAnimationFrame(()=>{if(!opened)return;const target=selector?screen.querySelector(selector):null;(target||dialog).focus({preventScroll:true})})}
  function drawSettings(){
    const s=qs();
    const intro=el('p','rq-intro','답안칸에 직접 써서 채점하거나, 정답을 확인하며 풀 수 있습니다. 채점과 정답 확인 후에도 현재 문제를 유지하며, 다음 버튼을 눌러야 넘어갑니다.');
    intro.id='rqDialogDescription';screen.append(intro);
    if(s.queue.length&&s.cursor<s.queue.length){
      const resume=el('div','rq-resume'),copy=el('div','rq-resume-copy',`이전 퀴즈 이어풀기 · ${s.cursor+1} / ${s.queue.length}`);
      copy.append(el('small','',`${s.cursor}문제 확인 · 순서와 진행 위치 저장됨`));
      resume.append(copy,button('이어서 풀기',()=>{s.screen='round';persist();draw()}));screen.append(resume);
    }
    const form=el('div','rq-settings');
    const scopeField=el('div','rq-field'),label=el('label','rq-label','출제 범위');label.htmlFor='rqScope';
    const select=el('select');select.id='rqScope';
    [['current',`현재 학습 범위 (${candidates('current').length}문제)`],['all',`전체 ${ACTIVE_QUESTION_COUNT}문제`],['needsStudy',`암기 못함 (${candidates('needsStudy').length}문제)`]].forEach(([value,name])=>{const option=el('option','',name);option.value=value;select.append(option)});
    select.value=s.settings.scope;
    const scopeHint=el('p','rq-hint');scopeHint.id='rqScopeHint';select.setAttribute('aria-describedby',scopeHint.id);
    scopeField.append(label,select,scopeHint);
    const sizeField=el('fieldset','rq-field'),legend=el('legend','rq-label','이번에 풀 문제 수'),sizes=el('div','rq-size-options');
    ['10','20','30','all'].forEach(size=>{const b=button(size==='all'?'모두':`${size}문제`,()=>{s.settings.size=size;persist();updateOptions()});b.dataset.rqSize=size;b.setAttribute('aria-pressed',String(s.settings.size===size));sizes.append(b)});
    sizeField.append(legend,sizes);
    const start=button('',()=>beginRound(candidates(s.settings.scope),describeScope(s.settings.scope),s.settings.size),'rq-primary rq-start');start.id='rqStart';
    const note=el('p','rq-hint',`탈탈을 기준으로 과년도 중복 ${REMOVED_DUPLICATE_COUNT}문항을 제외한 ${ACTIVE_QUESTION_COUNT}문제가 출제됩니다. 같은 문항은 한 회차에 한 번만 나오며, ‘암기 못함’에는 아직 분류하지 않은 문제도 포함됩니다. 현재 연도와 검색 조건을 적용합니다.`);
    form.append(scopeField,sizeField,start,note);screen.append(form);
    function updateOptions(){
      const count=candidates(s.settings.scope).length,requested=s.settings.size==='all'?count:Number(s.settings.size),n=Math.min(count,requested);
      const unfinished=s.queue.length&&s.cursor<s.queue.length;
      start.textContent=count?`${unfinished?'새로 ':''}랜덤 ${n}문제 시작`:'선택한 범위에 문제가 없습니다';start.disabled=!count;
      scopeHint.textContent=describeScope(s.settings.scope)+(count<requested?` · ${count}문제로 진행합니다.`:'');
      sizes.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.rqSize===s.settings.size)));
    }
    select.addEventListener('change',()=>{s.settings.scope=select.value;persist();updateOptions()});
    updateOptions();focusFirst(s.queue.length&&s.cursor<s.queue.length?'.rq-resume button':'#rqScope');
  }
  function beginRound(indices,scopeLabel,size){
    const pool=shuffled(indices);
    const requested=size==='all'?pool.length:Number(size)||20;
    const queue=pool.slice(0,Math.min(requested,pool.length));
    if(!queue.length){message('이 범위에는 출제할 문제가 없습니다. 다른 범위를 선택하세요.');return}
    const s=qs();Object.assign(s,{queue,cursor:0,revealed:false,results:[],answers:{},grades:{},screen:'round',scopeLabel,startedAt:Date.now(),completedAt:0,restoredOriginals:0});
    persist();draw();
  }
  function currentGrade(q){
    const s=qs(),key=qkey(q),record=s.grades[key];
    return validGradeRecord(record,inputValues(q,s.answers[key]),q)?record:null;
  }
  function captureInputs(index,invalidate=false){
    const s=qs();
    if(s.screen!=='round'||s.queue[s.cursor]!==index||!BANK[index])return null;
    const q=BANK[index],key=qkey(q),inputs=[...screen.querySelectorAll('#rqInputs .rq-answer-input')];
    if(inputs.length!==CivilGrader.schema(q).inputCount)return null;
    const values=inputs.map(input=>input.value);s.answers[key]=values;
    if(invalidate||(s.grades[key]&&!validGradeRecord(s.grades[key],values,q)))delete s.grades[key];
    return values;
  }
  function growQuizInput(input){
    input.style.height='48px';
    input.style.height=`${Math.max(48,Math.min(220,input.scrollHeight+2))}px`;
  }
  function drawInputSection(index,q){
    const key=qkey(q),spec=CivilGrader.schema(q),values=inputValues(q,qs().answers[key]);
    const section=el('section','rq-input-section');section.setAttribute('aria-labelledby','rqInputTitle');
    const heading=el('div','rq-input-heading'),title=el('h3','rq-input-title','답안 작성');title.id='rqInputTitle';
    heading.append(title,el('span','rq-autosave','자동 저장'));
    const inputs=el('div','rq-inputs');inputs.id='rqInputs';
    values.forEach((value,i)=>{
      appendStudySectionPrompt(inputs,q,i);
      const row=el('div','rq-input-item');
      const label=el('label','rq-input-label',studyDisplayInputLabel(q,i,q.inputLabels?.[i]||`${i+1}.`));
      const input=el('textarea','rq-answer-input');input.id=`rqAnswer-${q.id}-${i}`;input.rows=1;input.value=value;
      label.htmlFor=input.id;input.placeholder=isStructuredTaltal(q)?'답안을 입력하세요.':`${i+1}번 답 입력`;input.setAttribute('autocomplete','off');input.setAttribute('aria-describedby','rqInputHelp');
      if(spec.sections.some(group=>group.kind==='list'&&group.required>1&&group.indexes.length===1&&group.indexes[0]===i))input.placeholder='여러 답은 줄바꿈으로 구분해 입력';
      input.addEventListener('compositionstart',()=>{composingField=input});
      input.addEventListener('compositionend',()=>{if(composingField===input)composingField=null});
      input.addEventListener('input',()=>{
        if(qs().screen!=='round'||qs().queue[qs().cursor]!==index)return;
        const hadGrade=!!qs().grades[key];captureInputs(index,true);growQuizInput(input);persist();
        if(hadGrade){renderRoundDetails(index);byId('rqInputHelp').textContent='답안을 수정했습니다. 채점 또는 Ctrl + Enter를 눌러 다시 채점하세요.'}
      });
      row.append(label,input);inputs.append(row);
      requestAnimationFrame(()=>{if(input.isConnected)growQuizInput(input)});
    });
    const actions=el('div','rq-input-actions');
    const check=button('채점',gradeCurrent,'rq-primary');check.id='rqCheck';check.title='입력한 답안 채점 · Ctrl + Enter';
    const reveal=button('정답 확인',()=>{
      if(!opened||qs().screen!=='round'||qs().queue[qs().cursor]!==index)return;
      captureInputs(index);qs().revealed=!qs().revealed;persist();renderRoundDetails(index);
    });
    reveal.id='rqReveal';reveal.setAttribute('aria-controls','rqOfficial');reveal.setAttribute('aria-expanded',String(qs().revealed));
    actions.append(check,reveal);
    const help=el('p','rq-hint','Ctrl + Enter: 채점 · Enter: 줄바꿈 · 채점과 정답 확인 후에도 현재 문제를 유지합니다.');help.id='rqInputHelp';
    section.append(heading,inputs,actions,help);
    if(spec.sections.some(group=>group.kind==='list'&&group.required>1))section.append(el('p','rq-hint rq-order-help','나열형 답안은 같은 항목 안에서 보기 번호와 입력 순서가 달라도 정답으로 인정합니다.'));
    screen.append(section);
    const details=el('div');details.id='rqRoundDetails';screen.append(details);
    renderRoundDetails(index);
  }
  function renderRoundDetails(index){
    const s=qs(),q=BANK[index],details=byId('rqRoundDetails');
    if(!q||!details||s.screen!=='round'||s.queue[s.cursor]!==index)return;
    details.replaceChildren();
    const record=currentGrade(q);
    byId('rqCheck').textContent=record?'다시 채점':'채점';
    byId('rqReveal').textContent=s.revealed?'정답 숨기기':'정답 확인';
    byId('rqReveal').setAttribute('aria-expanded',String(s.revealed));
    if(record){
      const data=record.data,box=el('section','rq-grade-result');box.id='rqGradeResult';box.setAttribute('aria-label','입력 답안 채점 결과');box.setAttribute('aria-live','polite');
      const summary=el('h3','rq-grade-summary',`${data.perfect?'모두 정답':'채점 결과'} · 정답 ${data.correctCount} / ${data.total}${data.partialCount?` · 부분정답 ${data.partialCount}`:''}`);
      box.append(summary,el('p','rq-grade-note',data.perfect?'입력한 답안을 모두 맞혔습니다. 다음 문제로 이동하려면 아래에서 선택하세요.':'빈칸은 미작성으로 판정합니다. 답안을 고친 뒤 다시 채점할 수 있습니다.'));
      data.results.forEach((result,i)=>{
        const row=el('div','rq-grade-row');
        const entered=String(result.entered||''),empty=!entered.trim(),status=result.score===1?'정답':result.score>0?'부분정답':empty?'미작성':'오답';
        row.dataset.result=result.score===1?'correct':result.score>0?'partial':empty?'missing':'wrong';
        const head=el('div','rq-grade-head');head.append(el('span','rq-grade-label',result.label||`${i+1}번 답안`),el('span','rq-grade-status',status));
        row.append(head,el('div','rq-grade-mine',`내 답: ${empty?'미작성':entered}`));
        if(result.score!==1&&result.expected)row.append(el('div','rq-grade-expected',`정답: ${result.expected}`));
        if(result.score!==1&&result.reason)row.append(el('div','rq-grade-reason',result.reason));
        box.append(row);
      });
      details.append(box);
    }
    if(s.revealed){
      const answer=el('section','rq-answer');answer.id='rqOfficial';answer.setAttribute('aria-label','등록된 모범답');
      answer.append(el('h3','rq-answer-title','모범답'));
      CivilGrader.officialRows(q).forEach(item=>{const row=el('div','rq-answer-row');if(!/^\s*\d+\.\s*$/.test(String(item.label)))row.classList.add('rq-labeled');if(String(item.label).length>18)row.classList.add('rq-stacked-label');row.append(el('span','rq-answer-label',item.label),el('span','rq-answer-text',item.text));answer.append(row)});
      appendStudySolutionExtras(answer,q);
      details.append(answer);
    }
    if(s.revealed||record){
      const rating=el('div','rq-rate');
      const known=button('알고 있음 · 다음',()=>rate(index,'known'),'rq-primary');known.id='rqKnown';
      const retry=button('다시 풀기 · 다음',()=>rate(index,'retry'));retry.id='rqRetry';
      rating.append(known,retry);details.append(rating,el('p','rq-hint','알고 있음 → 암기 완료 · 다시 풀기 → 암기 못함으로 저장하고 다음 문제로 이동합니다.'));
    }
  }
  function gradeCurrent(){
    const s=qs();
    if(!opened||busy||s.screen!=='round'||composingField?.isConnected)return false;
    const index=s.queue[s.cursor],q=BANK[index];if(!q)return false;
    const values=captureInputs(index);if(!values)return false;
    try{
      const data=CivilGrader.grade(q,values);
      // Quiz answers and grades never write the main study's answers/attempts.
      s.grades[qkey(q)]={version:CivilGrader.gradingVersion(q),values:[...values],data,at:Date.now()};
      persist();renderRoundDetails(index);
      byId('rqInputHelp').textContent='Ctrl + Enter: 다시 채점 · Enter: 줄바꿈 · 다음 문제로 이동하려면 아래에서 선택하세요.';
      if(lastStorageError)message('브라우저 저장에 실패해 이번 진행은 현재 창에서만 유지됩니다.');
      return true;
    }catch(error){message('답안을 채점하지 못했습니다. 입력 내용을 확인한 뒤 다시 채점해 주세요.');return false}
  }
  function drawRound(){
    const s=qs(),index=s.queue[s.cursor],q=BANK[index];
    if(!q){s.screen='summary';persist();drawSummary();return}
    const t=totals(),progress=el('div','rq-progress-top');
    progress.append(el('span','',`${s.cursor+1} / ${s.queue.length} 문제`),el('span','',`알고 있음 ${t.known} · 다시 풀기 ${t.retry} · 건너뜀 ${t.skip}`));
    const track=el('div','rq-track');track.setAttribute('role','progressbar');track.setAttribute('aria-label','확인한 문제 수');track.setAttribute('aria-valuemin','0');track.setAttribute('aria-valuemax',String(s.queue.length));track.setAttribute('aria-valuenow',String(s.cursor));
    const fill=el('div','rq-fill');fill.style.width=`${s.cursor/s.queue.length*100}%`;track.append(fill);
    const meta=el('div','rq-meta');meta.append(el('span','rq-tag',`원문 ${q.number}번`),el('span','rq-tag',`출제 ${q.label}`));
    const question=el(isStructuredTaltal(q)?'div':'p','rq-question');renderStudyQuestion(question,q);question.id='rqDialogDescription';
    screen.append(progress,track,meta,question);
    drawInputSection(index,q);
    const footer=el('div','rq-footer');
    footer.append(el('p','',`${s.scopeLabel}\n닫아도 진행 위치는 저장됩니다.`),button('건너뛰기',()=>rate(index,'skip'),'rq-quiet'));screen.append(footer);
    focusFirst('#rqInputs .rq-answer-input');
  }
  function rate(index,choice){
    const s=qs();
    if(!opened||busy||s.screen!=='round'||s.queue[s.cursor]!==index||!validChoice(choice)||(choice!=='skip'&&!s.revealed&&!currentGrade(BANK[index])))return;
    busy=true;
    try{
      captureInputs(index);
      if(choice==='known'){
        if(typeof window.CivilQuickStudy?.markKnown!=='function')throw new Error('암기 저장 기능을 찾을 수 없습니다.');
        const ok=window.CivilQuickStudy.markKnown(index,'random-quiz');if(ok===false)throw new Error('암기 기록을 저장하지 못했습니다.');
      }else if(choice==='retry'){
        if(typeof window.CivilQuickStudy?.markRetry!=='function')throw new Error('암기 저장 기능을 찾을 수 없습니다.');
        const ok=window.CivilQuickStudy.markRetry(index,'random-quiz');if(ok===false)throw new Error('암기 기록을 저장하지 못했습니다.');
      }
      s.results.push({index,choice,at:Date.now()});s.cursor++;s.revealed=false;
      if(s.cursor>=s.queue.length){s.screen='summary';s.completedAt=Date.now()}
      persist();draw();
    }catch(e){message(e?.message||'처리하지 못했습니다. 다시 시도해 주세요.')}
    finally{requestAnimationFrame(()=>{busy=false})}
  }
  function drawSummary(){
    const s=qs(),t=totals();
    screen.append(el('h3','rq-summary-heading','이번 퀴즈를 마쳤어요'));
    const description=el('p','rq-intro',`${s.queue.length}문제의 자가 확인 기록입니다. 알고 있는 문제는 암기 완료로 저장했습니다.`);description.id='rqDialogDescription';screen.append(description);
    const stats=el('div','rq-stats');
    [[t.known,'알고 있음'],[t.retry,'다시 풀기'],[t.skip,'건너뜀']].forEach(([n,label])=>{const tile=el('div','rq-stat');tile.append(el('strong','',n),el('span','',label));stats.append(tile)});
    screen.append(stats,el('p','rq-hint','위 숫자는 직접 선택한 암기 상태입니다. 답안을 입력해 채점한 점수와는 별도로 기록합니다.'));
    const actions=el('div','rq-summary-actions');
    const retryIndices=s.results.filter(r=>r.choice==='retry').map(r=>r.index);
    const retry=button(`다시 풀기만 퀴즈 (${retryIndices.length}문제)`,()=>beginRound(retryIndices,'직전 퀴즈에서 다시 풀기로 선택한 문제','all'),'rq-primary');retry.disabled=!retryIndices.length;
    const again=button('범위 선택하고 새 퀴즈',()=>{s.screen='settings';persist();draw()});again.id='rqNewQuiz';
    actions.append(retry,again,button('기존 학습으로 돌아가기',close,'rq-quiet'));screen.append(actions);
    focusFirst(retryIndices.length?'.rq-primary':'#rqNewQuiz');
  }
  function draw(){
    if(!opened)return;
    screen.replaceChildren();screen.scrollTop=0;
    const s=qs();
    byId('rqSettingsButton').hidden=s.screen==='settings';
    if(s.screen==='round'&&s.cursor<s.queue.length)drawRound();
    else if(s.queue.length&&s.cursor>=s.queue.length&&s.screen!=='settings')drawSummary();
    else drawSettings();
    if(s.restoredOriginals){message(`이전 풀이 기록을 유지하고 빠졌던 ${s.restoredOriginals}문제를 추가했습니다. 전체 ${ACTIVE_QUESTION_COUNT}문제입니다.`);s.restoredOriginals=0;persist()}
    if(lastStorageError)message('브라우저 저장에 실패해 이번 진행은 현재 창에서만 유지됩니다.');
  }
  function focusable(){return [...modal.querySelectorAll('button:not([disabled]),select:not([disabled]),input:not([disabled]),textarea:not([disabled]),[tabindex="0"]')].filter(n=>!n.hidden&&n.getClientRects().length)}
  function lockBackground(){
    inertRecords=[];
    for(const node of [...document.body.children]){
      if(node===modal||['SCRIPT','STYLE','LINK'].includes(node.tagName))continue;
      inertRecords.push({node,inert:node.inert,hidden:node.getAttribute('aria-hidden')});
      node.inert=true;node.setAttribute('aria-hidden','true');
    }
    document.body.classList.add('civil-random-quiz-open');
  }
  function unlockBackground(){
    for(const item of inertRecords){item.node.inert=item.inert;if(item.hidden===null)item.node.removeAttribute('aria-hidden');else item.node.setAttribute('aria-hidden',item.hidden)}
    inertRecords=[];document.body.classList.remove('civil-random-quiz-open');
  }
  function open(){
    if(opened)return;
    previousFocus=document.activeElement;opened=true;qs().open=true;modal.hidden=false;
    lockBackground();persist();draw();
  }
  function close(){
    if(!opened)return;
    captureInputs(qs().queue[qs().cursor]);
    opened=false;qs().open=false;modal.hidden=true;unlockBackground();
    window.CivilQuickStudy?.updateCounters?.();persist();
    const target=previousFocus?.isConnected&&!previousFocus.closest('[inert]')?previousFocus:launcher;
    if(target?.getClientRects().length)target.focus({preventScroll:true});else launcher.focus({preventScroll:true});
    previousFocus=null;
  }
  function reset(){
    if(opened){opened=false;modal.hidden=true;unlockBackground()}
    state.randomQuiz=fresh();busy=false;composingField=null;persist();previousFocus=null;
  }
  launcher.addEventListener('click',open);byId('rqCloseButton').addEventListener('click',close);
  byId('resetConfirmYes')?.addEventListener('click',reset);
  byId('rqSettingsButton').addEventListener('click',()=>{captureInputs(qs().queue[qs().cursor]);qs().screen='settings';persist();draw()});
  // Capture prevents legacy document-level Enter/arrow handlers from changing the hidden study view.
  // Root also gates its earlier window-capture Ctrl+Enter handler while this modal is open.
  window.addEventListener('keydown',e=>{
    if(!opened)return;
    e.stopImmediatePropagation();
    // Native Korean composition and ordinary textarea Enter keep their defaults.
    if(e.isComposing||e.keyCode===229||composingField?.isConnected)return;
    if(e.key==='Escape'){e.preventDefault();close();return}
    if(e.key==='Tab'){
      const nodes=focusable(),first=nodes[0],last=nodes[nodes.length-1],active=document.activeElement;
      if(!first){e.preventDefault();dialog.focus();return}
      if(e.shiftKey&&(active===first||!nodes.includes(active))){e.preventDefault();last.focus()}
      else if(!e.shiftKey&&(active===last||!nodes.includes(active))){e.preventDefault();first.focus()}
      return;
    }
    if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)&&!e.shiftKey&&!e.altKey){
      e.preventDefault();if(!e.repeat&&qs().screen==='round')gradeCurrent();return;
    }
    const typing=e.target?.matches?.('textarea.rq-answer-input');
    if(!typing&&(e.key==='Enter'||e.key===' ')&&(e.repeat||e.ctrlKey||e.metaKey||e.altKey))e.preventDefault();
    if(!modal.contains(e.target)){e.preventDefault();dialog.focus({preventScroll:true})}
  },true);
  document.addEventListener('focusin',e=>{if(opened&&!modal.contains(e.target))dialog.focus({preventScroll:true})},true);
  window.CivilRandomQuiz={isOpen:()=>opened,open,close,reset,gradeCurrent};
  updateLauncher();
  if(qs().open)requestAnimationFrame(open);
})();
</script>

<script id="compact-header-inline-placement-v7-script">
(()=>{
  const button=document.getElementById('headerCompactToggle');
  const headerActions=document.querySelector('header .header-actions');
  const questionTools=document.querySelector('main .meta-tools');
  if(!button||!headerActions||!questionTools)return;
